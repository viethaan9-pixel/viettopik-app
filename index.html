<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOPIK II 연습</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="TOPIK II">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen phone app — header / scrolling middle / action footer. Dialogue script as chat-like speaker rows; female = warm, male = cool. */
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --ink:#16203A; --muted:#5E6782; --line:#D5DAE6;
  --accent:#2B4FA8; --accent-ink:#FFFFFF; --accent-soft:#DCE4F7;
  --good:#1D8449; --good-soft:#DAF0E1; --bad:#BF4836; --bad-soft:#F6E0DA;
  --mark:#F3C64E; --f:#B4436C; --f-soft:#F7E1EA; --m:#2C7A8C; --m-soft:#DDEFF2;
  --f-display:'Noto Sans KR','Be Vietnam Pro',system-ui,sans-serif;
  --f-vn:'Be Vietnam Pro','Noto Sans KR',system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1320; --surface:#181E2E; --ink:#E6EAF4; --muted:#97A0BA; --line:#2A3247;
  --accent:#7D9DF0; --accent-ink:#0B1430; --accent-soft:#1F2B4D;
  --good:#52C47F; --good-soft:#163222; --bad:#EC7B69; --bad-soft:#3A1F1A;
  --mark:#D9AE3F; --f:#EB8DB0; --f-soft:#3A2030; --m:#6CC3D4; --m-soft:#15323A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#181E2E; --ink:#E6EAF4; --muted:#97A0BA; --line:#2A3247;
  --accent:#7D9DF0; --accent-ink:#0B1430; --accent-soft:#1F2B4D;
  --good:#52C47F; --good-soft:#163222; --bad:#EC7B69; --bad-soft:#3A1F1A;
  --mark:#D9AE3F; --f:#EB8DB0; --f-soft:#3A2030; --m:#6CC3D4; --m-soft:#15323A; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-block:14px 10px;display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.back[hidden]{display:none}
.top h1{font-size:17px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speed{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mid{flex:1;min-height:0;overflow-y:auto;padding-block:4px 14px}
.foot{padding-block:10px 14px;display:flex;gap:10px}
.btn{flex:1;height:54px;border-radius:15px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.vn{font-family:var(--f-vn);color:var(--accent);font-size:13.5px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* home */
.hero{padding-block:8px 12px}
.hero .big{font-size:40px;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;color:var(--muted);font-weight:600}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;padding-block:2px 8px}
.day{min-width:0;padding:7px 8px;border-radius:13px;background:var(--surface);border:1.5px solid var(--line);text-align:left}
.day b{display:block;font-family:var(--f-vn);font-size:14px;white-space:nowrap}
.day span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day span{font-size:11.5px;color:var(--muted)}
.day[aria-current="true"]{background:var(--ink);border-color:var(--ink)}
.day[aria-current="true"] b,.day[aria-current="true"] span{color:var(--bg)}
.day.soon{opacity:.5}
.howto{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.howto div{padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;line-height:1.4}
.howto b{display:block;color:var(--accent);font-size:13px}
.howto span{font-family:var(--f-vn);color:var(--muted);font-size:11.5px}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin:18px 2px 8px}
.sec b{font-size:14px;color:var(--ink)}
.btn.sec{margin:0;justify-content:center;align-items:center;font-size:16px;color:var(--ink)}
.grp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);margin-bottom:8px}
.grp .n{min-width:44px;height:30px;padding:0 6px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12.5px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.grp .t{flex:1;min-width:0}
.grp .t b{display:block;font-size:15px}
.grp .t span{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:90px}
.dots i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.dots i.k{background:var(--good)} .dots i.w{background:var(--bad)}
.all{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--accent-soft);border:1.5px solid var(--accent);text-align:left}
.all b{display:block;color:var(--accent)}
.all span{font-size:12.5px}
/* question */
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.steps{display:flex;gap:6px;margin-top:10px}
.steps button{flex:1;padding:8px 0;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px}
.steps button i{font-style:normal;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:var(--bg)}
.steps button[aria-current="step"]{color:var(--ink);border-color:var(--ink)}
.steps button.ok i{background:var(--good);color:var(--surface)}
.qhead{display:flex;align-items:center;gap:8px;margin-top:14px}
.qno{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.instr{font-size:14.5px;font-weight:600;margin-top:6px}
.instr .vn{display:block;font-weight:400}
.player{margin-top:12px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px}
.playbtn{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px -10px var(--accent)}
.playbtn.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.pmeta{font-size:13px;color:var(--muted);text-align:center}
.wave{display:flex;gap:4px;height:22px;align-items:center}
.wave i{width:4px;border-radius:2px;background:var(--line);height:6px;transition:height .2s}
.wave.on i{background:var(--accent);animation:wv .9s infinite ease-in-out}
.wave.on i:nth-child(2){animation-delay:.1s}.wave.on i:nth-child(3){animation-delay:.2s}.wave.on i:nth-child(4){animation-delay:.3s}.wave.on i:nth-child(5){animation-delay:.4s}
@keyframes wv{50%{height:20px}}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ch{padding:13px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:left;font-weight:600;display:flex;gap:12px;align-items:center}
.ch .k{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:13px;background:var(--bg);color:var(--muted)}
.ch.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ch.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:14px}
.fb b{display:block;font-size:13px;margin-bottom:2px}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}
.fb .vn{display:block;margin-top:4px}
/* script */
.script{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ln{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.ln .who{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.ln.F .who{background:var(--f-soft);color:var(--f)} .ln.M .who{background:var(--m-soft);color:var(--m)}
.ln .tx{flex:1;min-width:0;font-size:16px;line-height:1.55;padding-top:5px}
.ln.blank .tx{color:var(--muted)}
.ln.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ln.ev .tx{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--mark) 60%,transparent) 60%);}
.ln.pick{border-color:var(--bad)}
.ln.hit{border-color:var(--good);background:var(--good-soft)}
.ln .sp{flex:none;color:var(--muted);padding-top:7px}
.tip{margin-top:10px;font-size:13px;color:var(--muted)}
.words{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.words span{padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.words em{font-style:normal;font-family:var(--f-vn);color:var(--accent);margin-left:4px}
.readbox{margin-top:12px;display:flex;gap:8px}
.rc{flex:1;padding:12px;border-radius:14px;border:2px dashed var(--line);text-align:center;font-weight:700;color:var(--muted)}
.rc.done{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good)}
/* tips + result */
.tcard{margin-top:10px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tcard h3{margin:0 0 4px;font-size:16px}
.tcard ul{margin:6px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.done{text-align:center;padding-block:24px 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
.done .big{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tb{display:grid;grid-template-columns:max-content minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;width:100%;margin-top:8px;text-align:left}
.tb span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.note{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center}
/* menu + writing + vocab */
.lvl{display:flex;align-items:center;gap:14px;width:100%;padding:18px 16px;margin-bottom:10px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);text-align:left}
.lvl .badge{flex:none;min-width:64px;height:64px;padding:0 8px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:17px;line-height:1.1;text-align:center}
.lvl b{display:block;font-size:19px;font-weight:800}
.lvl .vn{display:block}
.lvl .mm{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}
.lvl .go{margin-left:auto;flex:none;color:var(--accent);font-size:22px;font-weight:700}
.lvl:not(:disabled){border-color:var(--accent)}
.lvl:disabled{opacity:.55;cursor:default}
.lvl .soon{margin-left:auto;flex:none;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.mcard{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:16px 14px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);text-align:left;min-height:168px}
.mcard .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:10px}
.mcard b{font-size:20px;font-weight:800}
.mcard .mm{margin-top:auto;padding-top:10px;font-size:12px;color:var(--muted);line-height:1.45}
.mcard:disabled{opacity:.5;cursor:default}
.sent{margin-top:12px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:17px;line-height:1.9}
.blank{display:inline-block;min-width:80px;padding:0 8px;margin:0 3px;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;text-align:center;line-height:1.5}
.blank.fill{background:var(--good-soft);color:var(--good);border-color:var(--good);border-radius:6px 6px 0 0}
.blank.miss{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);border-radius:6px 6px 0 0}
 .p51 .ph{padding:10px 14px;font-weight:800;font-size:14px;border-bottom:1px solid var(--line);background:var(--accent-soft);color:var(--accent)}
.p51 .mk2{display:inline-block;min-width:38px;padding:0 6px;margin:0 2px;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:800;text-align:center}
.p51 .mk2.fill{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.p51 .mk2.miss{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.blank2{display:flex;align-items:center;gap:8px;margin-top:10px}
.blank2 b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.blank2 .inp{margin-top:0}
.inp.ok{border-color:var(--good)}.inp.no{border-color:var(--bad)}
.selfrow{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.selfrow button{height:34px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font:inherit;font-size:13px}
.selfrow button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.inp{width:100%;height:52px;margin-top:10px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.ok{border-color:var(--good)} .inp.no{border-color:var(--bad)}
.inp:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.irow{display:flex;gap:10px;align-items:center;margin-top:8px}
.irow b{flex:none;width:30px;font-size:20px;color:var(--accent);text-align:center}
.irow .inp{margin-top:0}
.pass{margin-top:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.pass .ph{padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.pass .pb{padding:14px;font-size:16px;line-height:1.8}
.pass .pb p{margin:0 0 4px}
.mk{font-weight:800;color:var(--accent);padding:1px 5px;background:var(--accent-soft);border-radius:6px;white-space:nowrap}
.mk.fill{color:var(--good);background:var(--good-soft);white-space:normal}
.model{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.model > span:last-child{display:flex;flex-direction:column}
.model small{color:var(--muted);font-size:12.5px}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 2px 10px;font-size:13px;color:var(--muted)}
.vlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.vrow{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow b{font-size:16px;flex:none}
.vrow .vn{flex:1;min-width:0;transition:filter .2s}
.vrow small{color:var(--muted);font-size:11px;white-space:nowrap}
.vlist.hide .vrow:not(.show) .vn{filter:blur(6px)}
/* reading */
.ul{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent);font-weight:700}
.headline{margin-top:12px;padding:18px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ink);font-size:18px;font-weight:800;line-height:1.5}
.notice .pb{border:2px solid var(--line);margin:10px;border-radius:12px}
.notice .nt{font-weight:800;text-align:center;margin-bottom:8px}
.pass .ol{padding:6px 0;border-bottom:1px dashed var(--line)} .pass .ol:last-child{border-bottom:0}
@media (prefers-reduced-motion: reduce){.playbtn.on,.wave.on i{animation:none}}

.mlogo{display:flex;align-items:center;gap:14px;padding-block:6px 14px}
.mlogo img{width:88px;height:88px;border-radius:50%;flex:none;box-shadow:0 6px 18px -10px rgba(0,0,0,.4)}
.mlogo b{display:block;font-size:22px;font-weight:800;line-height:1.2}
/* account */
.seg{display:flex;gap:6px;margin:4px 0 12px;padding:4px;border-radius:14px;background:var(--line)}
.seg button{flex:1;padding:9px 0;border-radius:11px;font-weight:700;font-size:15px;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.25}
.seg button small{font-family:var(--f-vn);font-weight:500;font-size:11.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.aform label{display:block;margin-top:10px;font-size:13px;font-weight:700;color:var(--muted)}
.aform .inp{margin-top:6px}
.guest{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:18px;padding:10px;border-radius:12px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.guest small{text-decoration:none;font-family:var(--f-vn);font-size:11.5px;margin-top:2px}
.ubar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px;font-size:13px;color:var(--muted)}
.ubar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ubar b{color:var(--ink)}
.ubar button{flex:none;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.stu .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.stu .sh b{font-size:16px;display:block}
.stu .sh small{font-size:12px;color:var(--muted)}
.lockbtn{flex:none;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg)}
.lockbtn.on{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.prow{display:flex;gap:5px;align-items:stretch;margin-top:5px;overflow-x:auto;scrollbar-width:none}
.prow .pl{flex:none;width:30px;font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center}
.pc{flex:none;min-width:58px;padding:4px 6px;border-radius:9px;background:var(--line);font-size:12.5px;font-weight:700;text-align:center;line-height:1.3;font-variant-numeric:tabular-nums}
.pc i{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:var(--muted)}
.pc em{display:block;font-style:normal;font-size:11px;font-weight:600;color:var(--good)}

.contact{flex:none;margin-left:auto;align-self:flex-start;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);color:#1877F2}

:root[data-sec="listen"],.mcard[data-m="listen"]{--accent:var(--c-listen);--accent-soft:var(--c-listen-soft)}
:root[data-sec="write"],.mcard[data-m="write"]{--accent:var(--c-write);--accent-soft:var(--c-write-soft)}
:root[data-sec="read"],.mcard[data-m="read"]{--accent:var(--c-read);--accent-soft:var(--c-read-soft)}
:root[data-sec="vocab"],.mcard[data-m="vocab"]{--accent:var(--c-vocab);--accent-soft:var(--c-vocab-soft)}
.mcard[data-m]{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.mcard[data-m] b{color:var(--accent)}
.day[aria-current="true"]{background:var(--accent);border-color:var(--accent)}
.day[aria-current="true"] b,.day[aria-current="true"] span{color:var(--accent-ink)}
.day.lock{background:var(--line);border-color:var(--undone);cursor:not-allowed}
.day.lock b,.day.lock span{color:var(--muted)}
/* not-yet-solved marks: darker so they stand out */
.dots i{background:var(--undone)}
.bar{background:color-mix(in srgb,var(--undone) 55%,var(--line))}
.day.soon{opacity:1;background:var(--line);border-color:var(--undone)}
.day.soon b,.day.soon span{color:var(--muted)}
</style>

function pickVoices(){
  if(!canSpeak) return; const ko=koVoices(), o=VOPT();
  const byName=n=>n&&ko.find(v=>v.name===n);
  const male=ko.find(v=>/\bmale|남|injoon|minjun|minsu|jinho|hyunsu|bongjin|gookmin|seungjin/i.test(v.name)&&!/female/i.test(v.name));

  VF=byName(o.f)||fem||ko[0]||null; VM=byName(o.m)||male||ko.find(v=>v!==VF)||ko[0]||null;

const TTSV={M:"ko-KR-Neural2-C",F:"ko-KR-Neural2-A"};
const fnv=(s,h)=>{ for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; };

let AUD=new Set(); const AU=new Audio(); AU.preload="auto";
fetch("audio/index.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.keys) AUD=new Set(j.keys); }).catch(()=>{});
const useRec=()=>!VOPT().dev;
function sayRec(sp,t){
  return new Promise(res=>{
    let done=false; const fin=ok=>{ if(done) return; done=true; AU.onended=AU.onerror=null; res(ok); };
    AU.onended=()=>fin(true); AU.onerror=()=>fin(false);
    AU.src=`audio/${ttsKey(sp,t)}.mp3`; AU.playbackRate=rate; try{ AU.preservesPitch=true; }catch(e){}
    const pr=AU.play(); if(pr&&pr.catch) pr.catch(()=>fin(false));
    setTimeout(()=>fin(true), 6000+t.length*400/rate);
  });
}
function sayDevice(sp,text){
  return new Promise(res=>{
    if(!canSpeak){res();return;}
    const u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=0.95*rate;
    const v=sp==="M"?VM:VF; if(v) u.voice=v;
    u.pitch = (VF&&VM&&VF!==VM)? 1 : (sp==="M"?MPITCH:1.08);
    u.onend=res; u.onerror=res; speechSynthesis.speak(u);
    setTimeout(res, 4000+text.length*350/rate);
  });
}
async function sayLine(sp,text){
  sp=sp==="M"?"M":"F"; const t=String(text).replace(/\(.*?\)/g,"").replace(/~/g,"").trim();
  if(useRec()&&AUD.has(ttsKey(sp,t))){ if(await sayRec(sp,t)) return; }
  return sayDevice(sp,t);
}
async function playLines(lines,{onLine,skipBlank=true,fill}={}){
  stopAll(); const tk=++playToken; playing=true; uiPlay(true);
  for(let i=0;i<lines.length;i++){
    if(tk!==playToken) return;
    let [sp,tx]=lines[i];
    if(tx==="_"){ if(skipBlank&&!fill) continue; tx=fill; }
    onLine&&onLine(i);
    await sayLine(sp,tx);
    if(tk!==playToken) return;
    await new Promise(r=>setTimeout(r,350));
  }
  if(tk===playToken){ playing=false; uiPlay(false); onLine&&onLine(-1); }
}

/* ---------- question flow ---------- */
let run=[],ri=0,step=0,ord=null,answered=null,runRes={};
function startRun(ids){ run=ids; ri=0; runRes={}; openQ(); }
function openQ(){ step=0; answered=null; ord=null; renderQ(); }
function curQ(){ return Q()[run[ri]]; }
function renderQ(){ sec("listen");
  stopAll();
  const qi=run[ri], q=curQ(), T=TYPES[q.t];
  setTitle(`${DAYS[DAY].title} · ${qi+1}번`,true); $("speed").hidden=false;
  const hasAns=answered!==null;
  $("body").innerHTML=`
   <div class="prog"><span>${ri+1} / ${run.length}</span><div class="bar"><i style="width:${(ri+step/2)/run.length*100}%"></i></div></div>
   <div class="steps" id="steps">${["듣고 풀기","근거 찾기"].map((s,i)=>`<button data-s="${i}" aria-current="${i===step?"step":"false"}" class="${(i===0&&hasAns)||(i===1&&ST.ev[qi])?"ok":""}" ${i>0&&!hasAns?"disabled":""}><i>${i+1}</i>${s}</button>`).join("")}</div>
   <div class="qhead"><span class="qno">${String(qi+1).padStart(2,"0")}</span><span class="chip">${T.ko}</span></div>
   <div class="instr">${T.q}<span class="vn">${T.qvn}</span></div>
   <div id="stage"></div>`;
  $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(b.disabled) return; step=+b.dataset.s; renderQ(); });
  [stepListen,stepEvidence][step](q,qi);
}
function stepListen(q,qi){
  if(!ord) ord=shuffle([0,1,2,3]);
  const hasAns=answered!==null;
  $("stage").innerHTML=`
   <div class="player"><button class="playbtn" id="pbtn" aria-label="듣기">${ICON.play}</button><div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div>
     <div class="pmeta">${hasAns?"대본은 ② 근거 찾기에서 볼 수 있어요":"대본 없이 듣고 답을 고르세요 · Nghe rồi chọn"}</div></div>
   <div class="choices" id="chs">${ord.map((oi,pos)=>`<button class="ch" data-i="${oi}"><span class="k">${circ[pos]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>
   <div id="fb"></div>`;
  $("pbtn").onclick=()=>{ if(playing){stopAll();return;} playLines(q.l); };
  const chs=[...$("chs").querySelectorAll(".ch")];
  const mark=pick=>{
    chs.forEach(b=>{b.disabled=true; if(+b.dataset.i===q.a) b.classList.add("ok"); if(pick!==null&&+b.dataset.i===pick&&pick!==q.a) b.classList.add("no");});
    const ok=pick===q.a;
    $("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"정답이에요":"정답은 "+circ[ord.indexOf(q.a)]}</b>${esc(renum(q.ex,ord))}<span class="vn">${esc(renum(q.exv,ord))}</span></div>`;
    foot(`<button class="btn pri" id="nx">② 근거 찾기</button>`); $("nx").onclick=()=>{step=1;renderQ();};
    try{$("fb").scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}
  };
  if(hasAns){ mark(answered); return; }
  chs.forEach(b=>b.onclick=()=>{
    stopAll(); answered=+b.dataset.i; const ok=answered===q.a;
    ST.res[qi]=ok; runRes[qi]=ok; save(); mark(answered);
    $("steps").querySelector('[data-s="0"]').classList.add("ok");
    $("steps").querySelectorAll("button").forEach(x=>x.disabled=false);
  });
  foot(`<button class="btn sec" id="skip">잘 모르겠어요</button>`);
  $("skip").onclick=()=>{ answered=-1; ST.res[qi]=false; runRes[qi]=false; save(); mark(null); $("steps").querySelectorAll("button").forEach(x=>x.disabled=false); };
  setTimeout(()=>{ if(!hasAns&&step===0) playLines(q.l); },400);
}
function scriptHtml(q,opts={}){
  return `<div class="script" id="script">${q.l.map(([sp,tx],i)=>{
    const t= tx==="_" ? (opts.fill?`<b>${esc(q.o[q.a])}</b>`:"______") : esc(tx);
    return `<button class="ln ${sp} ${tx==="_"?"blank":""} ${opts.ev&&q.ev.includes(i)?"ev":""}" data-i="${i}"><span class="who">${sp==="F"?"여자":"남자"}</span><span class="tx">${t}</span>${opts.sp?`<span class="sp">${ICON.sp}</span>`:""}</button>`}).join("")}</div>`;
}
function stepEvidence(q,qi){
  const shown=!!ST.ev[qi];
  $("stage").innerHTML=`<div class="tip">${shown?"노란 줄이 정답의 근거예요.":"정답의 근거가 되는 문장을 눌러 보세요. · Chạm vào câu căn cứ."}</div>${scriptHtml(q,{ev:shown,fill:true})}<div id="efb"></div><div class="words">${q.w.map(w=>`<span>${esc(w[0])}<em>${esc(w[1])}</em></span>`).join("")}</div>`;
  const lns=[...$("script").querySelectorAll(".ln")];
  const reveal=(ok)=>{
    lns.forEach((b,i)=>{ if(q.ev.includes(i)) b.classList.add("ev","hit"); });
    $("efb").innerHTML=`<div class="fb ${ok?"ok":""}"><b>${ok?"근거를 찾았어요":"근거 문장"}</b>${esc(renum(q.ex,ord))}<span class="vn">${esc(renum(q.exv,ord))}</span></div>`;
    ST.ev[qi]=true; save(); $("steps").querySelector('[data-s="1"]').classList.add("ok");
    const last=ri===run.length-1;
    foot(`<button class="btn pri" id="nx">${last?"결과 보기":"다음 문제"}</button>`);
    $("nx").onclick=()=>{ stopAll(); if(last) result(); else { ri++; openQ(); $("body").scrollTop=0; } };
  };
  if(shown){ reveal(true); return; }
  lns.forEach((b,i)=>b.onclick=()=>{
    if(q.ev.includes(i)) reveal(true);
    else { b.classList.add("pick"); setTimeout(()=>b.classList.remove("pick"),600); $("efb").innerHTML=`<div class="fb no"><b>다시 찾아보세요</b>정답 「${esc(q.o[q.a])}」과 직접 연결되는 말을 찾으세요.</div>`; }
  });
  foot(`<button class="btn sec" id="sh">근거 보기</button>`); $("sh").onclick=()=>reveal(false);
}
function result(){ sec("listen");
  setTitle("결과",true);
  const ids=Object.keys(runRes).map(Number), ok=ids.filter(i=>runRes[i]).length;
  const byT={}; ids.forEach(i=>{const t=Q()[i].t; byT[t]=byT[t]||[0,0]; byT[t][1]++; if(runRes[i]) byT[t][0]++;});
  const wrong=ids.filter(i=>!runRes[i]);
  $("body").innerHTML=`<div class="done"><div class="eyebrow">${DAYS[DAY].title} · KẾT QUẢ</div><div class="big">${ok} / ${ids.length}</div>
    <div style="color:var(--muted);font-size:14px">${wrong.length?`틀린 문제: ${wrong.map(i=>i+1+"번").join(", ")}`:"모두 맞았어요!"}</div>
    ${Object.keys(byT).map(t=>`<div class="tb"><span class="chip" style="text-align:center">${TYPES[t].ko}</span><div class="bar"><i style="width:${byT[t][0]/byT[t][1]*100}%"></i></div><span>${byT[t][0]}/${byT[t][1]}</span></div>`).join("")}
    ${wrong.length?`<div class="tcard" style="text-align:left;width:100%"><h3>${TYPES[Q()[wrong[0]].t].ko} 공략법</h3><ul>${TYPES[Q()[wrong[0]].t].tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}</div>`;
  foot(`<button class="btn sec" id="h">처음으로</button>${wrong.length?`<button class="btn pri" id="re">틀린 ${wrong.length}문제 다시</button>`:""}`);
  $("h").onclick=home; if($("re")) $("re").onclick=()=>startRun(wrong);
}

  $("body").innerHTML=`${wProg()}
   <div class="qhead"><span class="qno">${String(k+1).padStart(2,"0")}</span><span class="chip">${k<10?"실용문":"설명문"}</span>${free?`<span class="chip star">⭐ 힌트 없이 도전</span>`:""}</div>
   <div class="instr">${free?"빈칸에 알맞은 말을 쓰십시오.<span class=\"vn\">Điền từ phù hợp vào chỗ trống.</span>":"괄호 안의 말을 알맞게 바꿔 쓰십시오.<span class=\"vn\">Chia từ trong ngoặc cho phù hợp với câu.</span>"}</div>
   <div class="sent">${esc(pre)}<span class="blank" id="bl">${free?"(　　　)":`(${esc(q.b)})`}</span>${esc(post)}</div>
   ${free?`<button class="hintbtn" id="hb">💡 힌트 보기 · Xem gợi ý</button>`:""}
   <input class="inp" id="in" lang="ko" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="여기에 쓰세요 · Viết vào đây">
   <div id="fb"></div>`;
  const inp=$("in");
  if(free) $("hb").onclick=()=>{ hint=true; $("bl").textContent=`(${q.b})`; $("hb").outerHTML=`<div class="tip" style="margin-top:8px">💡 힌트: <b>${esc(q.b)}</b> 를 알맞게 바꿔 쓰세요. · Chia từ <b>${esc(q.b)}</b>.</div>`; inp.focus(); };
  const done=(ok,v,self)=>{
    WS.n3[k]=ok; WS.n3a[k]=v; WS.h[k]=hint; wsave(); W.res[k]=ok;
    const star=ok&&free&&!hint; if($("hb")) $("hb").remove();
    inp.disabled=true; inp.classList.add(ok?"ok":"no");
    const bl=$("bl"); bl.textContent=ok?v:q.a[0]; bl.classList.add(ok?"fill":"miss");
    $("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?(star?"⭐ 힌트 없이 맞혔어요!":"정답이에요"):"정답: "+esc(q.a.join(" / "))}</b>${self&&ok?`내 답: ${esc(v)} · 모범 답안: ${esc(q.a.join(" / "))}<br>`:""}${!ok&&v?`내 답: ${esc(v)}<br>`:""}${free?`괄호 말: ${esc(q.b)}<br>`:""}${esc(q.p)}<span class="vn">${esc(q.pv)}</span></div>`;
    foot(`<button class="btn pri" id="nx">${last?"결과 보기":"다음 문제"}</button>`); $("nx").onclick=wNext;
  };
  const check=give=>{
    const v=give?"":inp.value.trim(); if(!give&&!v){inp.focus();return;}
    if(give) return done(false,"",false);
    if(q.a.some(x=>norm(x)===norm(v))) return done(true,v,false);
    if(free&&!hint){ // another wording may also be right: let the student compare and decide
      inp.disabled=true; if($("hb")) $("hb").remove();
      $("fb").innerHTML=`<div class="fb"><b>모범 답안과 비교해 보세요 · So sánh với đáp án mẫu</b>내 답: <strong>${esc(v)}</strong><br>모범 답안: <strong>${esc(q.a.join(" / "))}</strong> (괄호 말: ${esc(q.b)})<div class="tip" style="margin-top:6px">뜻과 문법이 맞으면 「맞았어요」를 누르세요.<span class="vn" style="display:block">Nếu đúng nghĩa và ngữ pháp thì bấm 「Đúng」.</span></div></div>`;
      foot(`<button class="btn sec" id="sn">틀렸어요 · Sai</button><button class="btn pri" id="sy">맞았어요 · Đúng</button>`);
      $("sn").onclick=()=>{ inp.disabled=false; done(false,v,true); }; $("sy").onclick=()=>{ inp.disabled=false; done(true,v,true); };
      return;
    }
    done(false,v,false);
  };
  inp.onkeydown=e=>{ if(e.key==="Enter"&&!e.isComposing){ e.preventDefault(); check(false);} };
  foot(`<button class="btn sec" id="skip">모르겠어요</button><button class="btn pri" id="ck">확인</button>`);
  $("ck").onclick=()=>check(false); $("skip").onclick=()=>check(true);
}

// real TOPIK 51·52 format: a short text with ( ㉠ ) and ( ㉡ ). Each blank is checked against model answers;
// a different wording is compared by the student (self-check), like the real exam's partial credit.
const is51Day=d=>!!(WDAYS[d||WDAY]&&WDAYS[d||WDAY][0]&&WDAYS[d||WDAY][0].k);
function render51(k,q,last){
  if(!WS.b2) WS.b2={};
  setTitle(`Ngày ${WDAY} 쓰기 · ${k+1}번`,wHome); $("speed").hidden=true;
  const mk=(t)=>esc(t).replace(/\( ?㉠ ?\)/g,'<span class="mk2" id="m1">( ㉠ )</span>').replace(/\( ?㉡ ?\)/g,'<span class="mk2" id="m2">( ㉡ )</span>');
  const is51=q.k==="51";
  $("body").innerHTML=`${wProg()}
   <div class="qhead"><span class="qno">${String(k+1).padStart(2,"0")}</span><span class="chip">${is51?"51번 · 실용문":"52번 · 설명문"}</span></div>
   <div class="instr">다음 글의 ㉠과 ㉡에 알맞은 말을 각각 쓰십시오.<span class="vn">Viết từ/cụm từ phù hợp vào ㉠ và ㉡. ${is51?"Giữ đúng thể văn của bài (습니다 / 해요 / 반말).":"Viết theo thể 「-다」."}</span></div>
   <div class="pass p51">${q.h?`<div class="ph">${esc(q.h)}</div>`:""}<div class="pb">${q.x.map(l=>`<p>${mk(l)}</p>`).join("")}</div></div>
   <div class="blank2"><b>㉠</b><input class="inp" id="i1" lang="ko" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="㉠ 여기에 쓰세요 · Viết ㉠"></div>
   <div class="blank2"><b>㉡</b><input class="inp" id="i2" lang="ko" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="㉡ 여기에 쓰세요 · Viết ㉡"></div>
   <div id="fb"></div>`;
  const i1=$("i1"), i2=$("i2"), A=[q.a1,q.a2];
  const match=(v,a)=>!!v&&a.some(x=>norm(x)===norm(v));
  const finish=(oks,vs)=>{
    const ok=oks[0]&&oks[1];
    WS.n3[k]=ok; WS.n3a[k]=vs; WS.b2[k]=oks; wsave(); W.res[k]=ok;
    [i1,i2].forEach((el,j)=>{ el.disabled=true; el.classList.add(oks[j]?"ok":"no"); const m=$("m"+(j+1)); if(m){ m.textContent=oks[j]&&vs[j]?vs[j]:A[j][0]; m.classList.add(oks[j]?"fill":"miss"); } });
    const n=oks.filter(Boolean).length;
    $("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"둘 다 맞았어요 · Đúng cả hai":n?"하나 맞았어요 · Đúng 1/2":"모범 답안을 보세요 · Xem đáp án mẫu"}</b>
      ㉠ ${esc(A[0].join(" / "))}<br>㉡ ${esc(A[1].join(" / "))}<br>${esc(q.p)}<span class="vn">${esc(q.pv)}</span></div>`;
    foot(`<button class="btn pri" id="nx">${last?"결과 보기":"다음 문제"}</button>`); $("nx").onclick=wNext;
  };
  const check=give=>{
    const vs=[i1.value.trim(),i2.value.trim()];
    if(give) return finish([false,false],["",""]);
    if(!vs[0]){ i1.focus(); return; } if(!vs[1]){ i2.focus(); return; }
    const auto=[match(vs[0],A[0]),match(vs[1],A[1])];
    if(auto[0]&&auto[1]) return finish(auto,vs);
    // a blank that differs from the model answers: the student compares and decides
    const pick=auto.map(x=>x?true:null);
    i1.disabled=i2.disabled=true;
    const row=j=>auto[j]?`<div style="margin-top:8px"><b>${j?"㉡":"㉠"}</b> ${esc(vs[j])} ✓</div>`:
      `<div style="margin-top:10px"><b>${j?"㉡":"㉠"}</b> 내 답: <strong>${esc(vs[j])}</strong><br>모범 답안: <strong>${esc(A[j].join(" / "))}</strong>
       <div class="selfrow"><button data-j="${j}" data-v="1" aria-pressed="false">맞았어요 · Đúng</button><button data-j="${j}" data-v="0" aria-pressed="false">틀렸어요 · Sai</button></div></div>`;
    $("fb").innerHTML=`<div class="fb"><b>모범 답안과 비교해 보세요 · So sánh với đáp án mẫu</b>${row(0)}${row(1)}
      <div class="tip" style="margin-top:8px">뜻, 문법, 문체(${is51?"습니다/해요/반말":"-다"})가 맞으면 「맞았어요」를 누르세요.<span class="vn" style="display:block">Đúng nghĩa, ngữ pháp và thể văn thì bấm 「Đúng」.</span></div></div>`;
    const go=()=>{ if(pick.every(x=>x!==null)){ i1.disabled=i2.disabled=false; finish(pick.map(Boolean),vs); } };
    $("fb").querySelectorAll(".selfrow button").forEach(b=>b.onclick=()=>{ const j=+b.dataset.j; pick[j]=b.dataset.v==="1";
      b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
    foot(`<button class="btn pri" id="sdone">확인 · Xong</button>`);
    $("sdone").onclick=()=>{ if(pick.some(x=>x===null)){ const f=$("fb").querySelector('.selfrow button[aria-pressed="false"]'); if(f) f.parentNode.scrollIntoView({block:"center"}); return; } go(); };
  };
  i1.onkeydown=e=>{ if(e.key==="Enter"&&!e.isComposing){ e.preventDefault(); i2.focus(); } };
  i2.onkeydown=e=>{ if(e.key==="Enter"&&!e.isComposing){ e.preventDefault(); check(false); } };
  foot(`<button class="btn sec" id="skip">모르겠어요</button><button class="btn pri" id="ck">확인</button>`);
  $("ck").onclick=()=>check(false); $("skip").onclick=()=>check(true);
}

function wResult(){ sec("write");
  setTitle("쓰기 결과",wHome); $("speed").hidden=true;
  const ids=Object.keys(W.res).map(Number), ok=ids.filter(i=>W.res[i]).length, wrong=ids.filter(i=>!W.res[i]);
  const name=i=>`${i+1}번`;
  const stars=isFree()?ids.filter(i=>W.res[i]&&!(WS.h||{})[i]).length:0;
  $("body").innerHTML=`<div class="done"><div class="eyebrow">Ngày ${WDAY} 쓰기 · KẾT QUẢ</div><div class="big">${ok} / ${ids.length}</div>${isFree()?`<div class="chip star" style="font-size:13px">⭐ 힌트 없이 맞힌 문제 ${stars}개</div>`:""}
    <div style="color:var(--muted);font-size:14px">${wrong.length?`틀린 문제: ${wrong.map(name).join(", ")}`:"모두 맞았어요!"}</div></div>
    ${W.k==="n3"&&wrong.length?`<div class="tcard"><h3>틀린 문장 정답</h3><ul>${wrong.map(i=>`<li>${i+1}번 · ${esc(NQ()[i].b)} → <b>${esc(NQ()[i].a[0])}</b> <span class="vn">${esc(NQ()[i].p)}</span></li>`).join("")}</ul></div>`:""}`;
  foot(`<button class="btn sec" id="h">쓰기 처음으로</button>${wrong.length?`<button class="btn pri" id="re">틀린 ${wrong.length}문제 다시</button>`:""}`);
  $("h").onclick=wHome; if($("re")) $("re").onclick=()=>wStart(W.k,wrong);
}

  $("body").innerHTML=`${dayTabs({days:Object.fromEntries(vDays().map(d=>[d,{title:"Ngày "+d,sub:wordList(d).length+"개"}])),cur:VDAY,done:()=>true})}

   <div class="vlist ${vHide?"hide":""}" id="vl">${list.map((w,i)=>`<button class="vrow" data-i="${i}"><b>${esc(w.k)}</b><span class="vn">${esc(w.v)}</span><small>${esc(w.src)}</small></button>`).join("")}</div>`;

}

 {"t": "빈칸(설명문)", "i": "fill", "k": "p", "x": "도시의 기온이 주변 농촌보다 높게 나타나는 현상을 '열섬'이라고 한다. 아스팔트와 콘크리트가 낮 동안 열을 저장했다가 밤에 내보내기 때문이다. 여기에 건물이 빽빽하게 들어서면 ( ) 열이 더 오래 머무른다. 도시에 바람길을 내려는 시도가 이어지는 것은 이 때문이다.", "o": ["햇빛이 전혀 들지 않아", "바람이 빠져나가지 못해", "비가 자주 내려", "나무가 크게 늘어나"], "a": 1, "ex": "'바람길을 내려는 시도'가 단서", "exv": "Manh mối: 'thử mở đường gió trong thành phố' → gió không thoát ra được (②)."},
 {"t": "빈칸(설명문)", "i": "fill", "k": "p", "x": "기업들은 신제품을 내놓기 전에 일부 지역에서만 먼저 팔아 본다. 전국에 한꺼번에 내놓았다가 실패하면 피해가 너무 크기 때문이다. 작은 범위에서 먼저 팔아 보면 ( ) 수 있다. 반응이 나쁘면 제품을 고치거나 출시를 미루면 된다.", "o": ["손해를 미리 줄일", "생산량을 한꺼번에 늘릴", "제품 가격을 크게 높일", "광고를 완전히 멈출"], "a": 0, "ex": "'실패하면 피해가 크다'와 연결", "exv": "Nối với 'nếu thất bại thì thiệt hại lớn' → giảm lỗ trước (①)."},
 {"t": "빈칸(설명문)", "i": "fill", "k": "p", "x": "예금 금리가 오르면 사람들은 소비를 줄이고 저축을 늘린다. 돈을 쓰는 것보다 맡겨 두는 편이 이익이기 때문이다. 이렇게 ( ) 물가가 오르는 속도를 어느 정도 누를 수 있다. 중앙은행이 금리를 조절하는 이유가 여기에 있다.", "o": ["시중에 도는 돈이 줄어들면", "수출이 갑자기 늘어나면", "세금이 크게 줄어들면", "공장의 생산이 멈추면"], "a": 0, "ex": "저축이 늘면 쓰는 돈이 줄어 물가 상승 압력이 낮아짐", "exv": "Tiết kiệm tăng thì tiền lưu thông giảm, áp lực tăng giá giảm (①)."},
 {"t": "빈칸(설명문)", "i": "fill", "k": "p", "x": "백신은 병을 일으키지 않을 만큼 약하게 만든 바이러스나 그 일부를 몸에 넣는 것이다. 몸은 이것을 진짜 침입자로 여기고 싸울 준비를 한다. 이 과정에서 만들어진 기억 덕분에 나중에 진짜 바이러스가 들어와도 ( ). 백신을 '미리 겪어 보는 연습'이라고 부르는 이유다.", "o": ["몸이 오히려 더 약해진다", "아무런 반응도 하지 않는다", "바이러스가 더 빠르게 늘어난다", "빠르게 막아 낼 수 있다"], "a": 3, "ex": "'싸울 준비'와 '기억'이 단서", "exv": "Manh mối: 'chuẩn bị chiến đấu' và 'trí nhớ' → ngăn chặn nhanh (④)."},
 {"t": "내용 일치", "i": "same3", "k": "p", "x": "한 연구팀이 도시에 사는 비둘기와 시골에 사는 비둘기의 행동을 비교했다. 도시 비둘기는 낯선 물건을 겁내지 않고 가까이 다가가는 경향이 뚜렷했다. 또 사람이 버린 음식의 포장을 여는 행동까지 익히고 있었다. 연구팀은 도시 환경이 동물의 행동을 바꾼다고 설명했다.", "o": ["도시 비둘기는 낯선 물건을 멀리했다.", "시골 비둘기가 포장을 여는 법을 익혔다.", "도시 환경이 동물의 행동에 영향을 준다.", "두 집단의 행동에는 차이가 없었다."], "a": 2, "ex": "연구팀의 결론 그대로 → ③", "exv": "Đúng kết luận của nhóm nghiên cứu → môi trường thành phố ảnh hưởng hành vi động vật (③)."},
 {"t": "내용 일치", "i": "same3", "k": "p", "x": "유리는 겉보기에 단단한 고체처럼 보이지만 분자의 배열이 규칙적이지 않다. 액체가 굳을 때 분자들이 제자리를 잡지 못한 채 멈춰 버린 상태에 가깝다. 그래서 유리를 일정 온도 이상으로 올리면 뚜렷한 녹는점 없이 서서히 물러진다.", "o": ["유리의 분자는 규칙적으로 배열되어 있다.", "유리는 아주 뚜렷한 녹는점을 가지고 있다.", "유리는 온도가 오르면 서서히 물러진다.", "유리는 완전한 액체 상태의 물질이다."], "a": 2, "ex": "'뚜렷한 녹는점 없이 서서히 물러진다' → ③", "exv": "'Không có điểm nóng chảy rõ ràng, mềm dần' → ③."},
 {"t": "내용 일치", "i": "same3", "k": "p", "x": "세계 여러 나라의 국기에는 비슷한 색이 반복해서 쓰인다. 빨강, 파랑, 흰색이 대표적인데 멀리서도 구별이 잘되고 염료를 구하기도 쉬웠기 때문이다. 깃발은 전쟁터나 바다에서 신호로 쓰였으므로 눈에 잘 띄는 것이 무엇보다 중요했다.", "o": ["국기의 색은 특별한 이유 없이 정해졌다.", "깃발은 신호를 보내는 데에도 쓰였다.", "이 색들의 염료는 구하기가 매우 어려웠다.", "국기는 가까이에서만 알아볼 수 있었다."], "a": 1, "ex": "'전쟁터나 바다에서 신호로 쓰였다' → ②", "exv": "'Được dùng làm tín hiệu trên chiến trường và biển' → ②."},
 {"t": "내용 일치", "i": "same3", "k": "p", "x": "한 도시가 쓰레기봉투 값을 올리자 처음 몇 달 동안은 쓰레기가 눈에 띄게 줄었다. 그러나 1년 뒤에는 다시 원래 수준으로 돌아왔다. 전문가들은 가격만으로는 습관을 오래 바꾸기 어렵다며 분리배출 방법을 알려 주는 교육이 함께 가야 한다고 지적했다.", "o": ["봉투 값을 올린 뒤 쓰레기가 계속 줄어들었다.", "전문가들은 교육이 필요 없다고 보았다.", "쓰레기의 양은 처음부터 변화가 없었다.", "가격을 올린 효과는 오래가지 못했다."], "a": 3, "ex": "'1년 뒤에는 원래 수준으로 돌아왔다' → ④", "exv": "'Sau 1 năm quay về mức cũ' → hiệu quả không kéo dài (④)."},
 {"t": "주제 찾기", "i": "topic2", "k": "p", "x": "공공 데이터를 개방하면 기업과 시민이 새로운 서비스를 만들 수 있다. 그러나 형식이 제각각이거나 갱신이 멈춘 자료는 실제로 쓰이지 못한다. 데이터는 공개하는 순간이 아니라 쓸 수 있게 다듬어졌을 때 비로소 가치를 가진다. 개방한 건수보다 품질을 따져야 한다.", "o": ["공공 데이터는 많이 공개할수록 좋다.", "데이터 개방은 기업에만 도움이 된다.", "공공 데이터는 공개하지 않는 편이 안전하다.", "공공 데이터는 쓸 수 있게 다듬어져야 가치가 있다."], "a": 3, "ex": "마지막 두 문장이 글쓴이의 주장", "exv": "Hai câu cuối: dữ liệu có giá trị khi được chỉnh sửa để dùng được (④)."},
 {"t": "주제 찾기", "i": "topic2", "k": "p", "x": "재난 문자는 많은 사람에게 빠르게 정보를 전한다는 점에서 효과적이다. 그러나 같은 내용이 반복되거나 나와 상관없는 지역의 소식이 계속 오면 사람들은 문자를 읽지 않게 된다. 정작 위험한 순간에 경고가 묻히는 것이다. 보내는 횟수보다 꼭 필요한 사람에게 닿는 것이 중요하다.", "o": ["재난 문자는 많이 보낼수록 안전해진다.", "재난 문자 제도는 없애는 편이 낫다.", "재난 문자는 꼭 필요한 사람에게 정확히 가야 한다.", "재난 문자는 지역을 구분하지 말고 보내야 한다."], "a": 2, "ex": "마지막 문장이 글쓴이의 주장", "exv": "Câu cuối: gửi đúng người cần quan trọng hơn số lần gửi (③)."},
 {"t": "주제 찾기", "i": "topic2", "k": "p", "x": "도시마다 오래된 건물을 헐고 새 건물을 세우는 일이 되풀이된다. 그러나 한 도시의 매력은 새 건물의 수가 아니라 시간이 쌓인 풍경에서 나온다. 모든 것을 새로 지은 도시는 어디를 가도 비슷해 보인다. 무엇을 지을지만큼 무엇을 남길지를 정하는 일이 중요하다.", "o": ["도시는 새 건물을 많이 지어야 발전한다.", "오래된 건물은 하나도 빠짐없이 보존해야 한다.", "도시의 매력은 건물의 높이에서 나온다.", "도시는 무엇을 남길지도 함께 정해야 한다."], "a": 3, "ex": "마지막 문장이 글쓴이의 주장", "exv": "Câu cuối: phải quyết định cả việc giữ lại cái gì (④)."},
 {"t": "문장 삽입", "i": "ins", "k": "ins", "x": "옛 농촌에서는 빗물을 모아 두었다가 논에 대는 방법을 썼다. ( ㉠ ) 그래서 마을마다 깊은 우물을 함께 파 두었다. ( ㉡ ) 여러 집이 돌아가며 물을 길어 쓰고 사용한 양을 기록했다. ( ㉢ ) 물을 나누는 규칙이 곧 마을의 질서였던 셈이다. ( ㉣ )", "given": "그러나 이 방식은 비가 적게 오는 해에는 쓸 수 없었다.", "o": ["㉠", "㉡", "㉢", "㉣"], "a": 0, "ex": "빗물 방식의 한계를 말한 뒤 '그래서 우물을 팠다'로 이어짐", "exv": "Nêu hạn chế của cách hứng nước mưa rồi nối '그래서 đào giếng' → ㉠."},

 {"t": "내용 일치", "i": "same3", "k": "p", "x": "한 연구팀이 같은 교실에서 창가 자리와 복도 자리에 앉은 학생들의 성적을 3년 동안 비교했다. 자리 자체가 성적에 미치는 영향은 거의 없었다. 다만 자리를 자주 바꾼 학급은 학생들 사이의 관계가 더 고르게 나타났다. 연구팀은 자리 배치의 의미를 성적이 아니라 관계에서 찾아야 한다고 밝혔다.", "o": ["자리 배치는 학생들 사이의 관계에 영향을 주었다.", "창가 자리에 앉은 학생의 성적이 더 높았다.", "자리를 자주 바꾸자 학급의 성적이 올랐다.", "이 연구는 1년 동안만 진행되었다."], "a": 0, "ex": "'자리를 자주 바꾼 학급은 관계가 더 고르게' → ①", "exv": "'Lớp đổi chỗ thường xuyên thì quan hệ đồng đều hơn' → ①."},

 {"t": "내용 일치", "i": "same3", "k": "p", "x": "한 도시가 횡단보도의 보행 신호 시간을 노인의 걸음 속도에 맞춰 늘렸다. 차량 통행이 느려질 것이라는 우려가 있었지만 실제로 측정해 보니 전체 통행 시간의 변화는 크지 않았다. 반면 보행 중에 일어나는 사고는 눈에 띄게 줄었다.", "o": ["이 도시는 보행 신호 시간을 줄였다.", "차량의 통행 시간이 크게 늘어났다.", "보행 중 사고는 전과 달라지지 않았다.", "신호를 늘려도 통행 시간 변화는 작았다."], "a": 3, "ex": "'전체 통행 시간의 변화는 크지 않았다' → ④", "exv": "'Tổng thời gian lưu thông thay đổi không nhiều' → ④."},

 {"t": "빈칸(설명문)", "i": "fill", "k": "p", "x": "역사 기록을 읽을 때는 누가 그 기록을 남겼는지를 먼저 보아야 한다. 글을 쓸 줄 아는 사람은 대개 지배층이었고, 그들의 눈에 들어온 일만 글로 남았다. 따라서 남아 있는 기록만으로 과거를 보면 ( ) 위험이 있다.", "o": ["사건의 날짜를 잘못 외울", "당시의 기술을 지나치게 높이 볼", "한쪽의 시선으로만 이해할", "기록의 분량을 잘못 셀"], "a": 2, "ex": "기록을 남긴 쪽이 지배층에 치우쳐 있었다는 점이 단서", "exv": "Người ghi chép chủ yếu là tầng lớp thống trị → chỉ hiểu quá khứ theo một góc nhìn (③)."},

 {"t": "내용 일치", "i": "same3", "k": "p", "x": "사람의 눈은 색을 구분하는 세포가 망막 가운데에 몰려 있다. 그래서 시야의 바깥쪽에서는 색보다 움직임을 먼저 알아챈다. 어두운 곳에서 옆에 있는 물체가 무엇인지 잘 보이지 않아도 그것이 움직이면 금방 느끼는 것은 이 때문이다.", "o": ["시야의 바깥쪽에서는 움직임을 먼저 알아챈다.", "색을 구분하는 세포는 망막 전체에 고르게 있다.", "어두운 곳에서는 움직임을 거의 느끼지 못한다.", "망막 가운데에는 세포가 거의 없다."], "a": 0, "ex": "'색보다 움직임을 먼저 알아챈다' → ①", "exv": "Ở rìa tầm nhìn, mắt nhận ra chuyển động trước màu sắc (①). Tế bào màu tập trung ở giữa võng mạc (②④ sai)."},
 {"t": "내용 일치", "i": "same3", "k": "p", "x": "한 나라가 자국 화폐의 가치를 일부러 낮추면 수출품의 가격 경쟁력은 올라간다. 그러나 원유나 곡물처럼 수입에 기대는 품목의 가격도 함께 오른다. 수출 기업의 이익과 국민의 생활비가 서로 반대 방향으로 움직이는 셈이다.", "o": ["화폐 가치가 내려가면 수입품 값도 함께 내려간다.", "화폐 가치가 떨어지면 수입품 가격은 올라간다.", "수출과 수입은 늘 같은 방향으로 움직인다.", "화폐 가치는 국민의 생활비와 관계가 없다."], "a": 1, "ex": "'수입에 기대는 품목의 가격도 함께 오른다' → ②", "exv": "Hạ giá trị tiền tệ → giá hàng nhập khẩu (dầu, ngũ cốc) cũng tăng (②)."},
 {"t": "내용 일치", "i": "same3", "k": "p", "x": "고려청자의 푸른빛은 유약 속의 철 성분이 가마 안에서 산소가 부족한 상태로 구워질 때 나타난다. 같은 흙과 유약을 써도 가마 안의 공기 조절에 실패하면 색이 누렇게 변한다. 색을 내는 기술의 핵심이 재료가 아니라 불의 조절에 있었던 것이다.", "o": ["청자의 색은 흙의 종류만으로 정해진다.", "산소가 많을수록 푸른빛이 잘 나타난다.", "가마 안의 공기 조절이 색을 좌우했다.", "유약에는 철 성분이 들어 있지 않다."], "a": 2, "ex": "'공기 조절에 실패하면 색이 변한다' → ③", "exv": "Điều chỉnh không khí trong lò thất bại thì màu bị vàng → kiểm soát lửa quyết định màu (③)."},
 {"t": "내용 일치", "i": "same3", "k": "p", "x": "한 연구팀이 도시의 소음 수준과 주민의 수면을 비교했다. 소음이 큰 지역의 주민은 잠드는 데 걸리는 시간이 길었지만 전체 수면 시간의 차이는 크지 않았다. 대신 깊은 잠의 비율이 뚜렷하게 낮았다. 연구팀은 소음의 영향이 잠의 양이 아니라 질에 나타난다고 설명했다.", "o": ["소음이 큰 지역의 수면 시간이 훨씬 짧았다.", "깊은 잠의 비율에는 차이가 없었다.", "소음과 수면 사이에는 관계가 없었다.", "소음은 잠의 질에 영향을 주었다."], "a": 3, "ex": "연구팀의 결론 그대로 → ④", "exv": "Kết luận: tiếng ồn ảnh hưởng đến chất lượng giấc ngủ chứ không phải lượng (④). Tổng thời gian ngủ không khác nhiều (① sai)."},
 {"t": "주제 찾기", "i": "topic2", "k": "p", "x": "전문가의 예측이 빗나가는 일은 흔하다. 그런데도 우리는 예측이 틀렸다는 사실보다 누가 맞혔는지에만 관심을 둔다. 한 번 맞힌 사람의 다음 예측도 맞을 것이라고 믿는 것이다. 중요한 것은 결과가 아니라 그 예측이 어떤 근거 위에서 만들어졌는가이다.", "o": ["예측은 어떤 근거 위에 서 있는지를 보고 판단해야 한다.", "예측은 전문가에게 전적으로 맡겨야 한다.", "예측을 자주 맞히는 사람을 찾아내야 한다.", "예측은 아예 하지 않는 편이 낫다."], "a": 0, "ex": "마지막 문장이 글쓴이의 주장", "exv": "Câu cuối: điều quan trọng là dự đoán dựa trên căn cứ gì (①)."},
 {"t": "주제 찾기", "i": "topic2", "k": "p", "x": "공공 기관의 문서는 정확성을 위해 길고 복잡해지는 경향이 있다. 그러나 읽는 사람이 이해하지 못한 문서를 정확하다고 할 수는 없다. 모든 경우를 담으려다 아무에게도 닿지 않는 문장이 되는 것이다. 공문서의 정확함은 읽히는 데서 시작된다.", "o": ["공문서는 길고 자세할수록 정확하다.", "공문서는 전문가가 쓰면 그것으로 충분하다.", "공문서는 무조건 짧게 쓰는 것이 좋다.", "공문서는 읽는 사람이 이해할 수 있어야 한다."], "a": 3, "ex": "'정확함은 읽히는 데서 시작된다'가 핵심", "exv": "'Sự chính xác của văn bản hành chính bắt đầu từ việc người ta đọc hiểu được' → ④."},
 {"t": "주제 찾기", "i": "topic2", "k": "p", "x": "도시의 녹지를 늘리자는 말에 반대하는 사람은 드물다. 문제는 그 녹지가 어디에 생기느냐이다. 공원이 들어서면 주변 집값이 오르고 원래 살던 사람들이 밀려나는 일이 되풀이됐다. 녹지를 늘리는 정책에는 누가 그 혜택을 누리게 되는지에 대한 계획이 함께 있어야 한다.", "o": ["도시에 공원을 지금보다 더 많이 지어야 한다.", "집값을 올리는 정책은 모두 멈춰야 한다.", "녹지는 도시 외곽에 만드는 것이 낫다.", "녹지 정책은 혜택이 누구에게 가는지도 따져야 한다."], "a": 3, "ex": "마지막 문장이 글쓴이의 주장", "exv": "Công viên làm giá nhà tăng, người cũ bị đẩy đi → phải tính cả ai được hưởng lợi (④)."},
 {"t": "주제 찾기", "i": "topic2", "k": "p", "x": "자동화가 사람의 일을 대신하면서 사고가 줄었다는 보고가 많다. 그러나 드물게 일어나는 사고의 성격은 달라졌다. 기계가 멈췄을 때 상황을 수습해야 하는 사람은 평소에 그 일을 직접 해 본 적이 없다. 자동화된 체계일수록 사람이 손으로 하는 훈련이 더 필요해지는 역설이 생기는 것이다.", "o": ["자동화는 오히려 사고를 늘리는 원인이다.", "기계는 절대 멈추지 않도록 만들어야 한다.", "자동화된 체계일수록 수동 조작 훈련이 필요하다.", "자동화를 더는 확대하지 말아야 한다."], "a": 2, "ex": "마지막 문장의 '역설'이 핵심", "exv": "Người xử lý sự cố chưa từng tự làm việc đó → càng tự động hóa càng cần luyện tập thao tác thủ công (③)."},
 {"t": "문장 삽입", "i": "ins", "k": "ins", "x": "옛 공동체는 마을 전체가 같은 작물을 심는 경우가 많았다. ( ㉠ ) 그래서 어떤 마을은 작물을 여러 종류로 나누어 심었다. ( ㉡ ) 수확량은 줄어도 한 작물이 병들었을 때 버틸 수 있었기 때문이다. ( ㉢ ) 이런 선택은 오늘날의 위험 분산과 다르지 않다. ( ㉣ )", "given": "그러나 이 방식은 한 해 농사를 망치면 모두가 굶는다는 위험을 안고 있었다.", "o": ["㉠", "㉡", "㉢", "㉣"], "a": 0, "ex": "같은 작물을 심던 방식의 위험 뒤에 '그래서'가 이어짐", "exv": "Câu cho sẵn nói rủi ro khi cả làng trồng một loại cây (bệnh là mất hết) → đặt ở ㉠, trước '그래서'."},
 {"t": "문장 삽입", "i": "ins", "k": "ins", "x": "조사 결과를 발표할 때는 표본이 전체를 대표한다는 가정이 깔려 있다. ( ㉠ ) 전화 조사만으로 자료를 모으면 전화를 받지 않는 사람들의 의견은 빠진다. ( ㉡ ) 응답률이 낮을수록 이런 문제는 더 커진다. ( ㉢ ) 숫자 자체보다 그 숫자가 어떻게 모였는지를 봐야 하는 이유다. ( ㉣ )", "given": "이 가정이 무너지면 통계의 결론도 함께 무너진다.", "o": ["㉠", "㉡", "㉢", "㉣"], "a": 2, "ex": "가정이 깨지는 사례를 설명한 뒤 그 결과가 이어짐", "exv": "Câu cho sẵn nói kết quả bị lệch (không đại diện) → sau ví dụ khảo sát điện thoại, tỉ lệ trả lời → ㉢."},
 {"t": "문장 삽입", "i": "ins", "k": "ins", "x": "약을 먹으면 성분이 온몸으로 퍼지기 때문에 필요 없는 곳에도 영향을 준다. ( ㉠ ) 최근에는 약을 아주 작은 알갱이에 담아 특정 부위에서만 풀리게 하는 기술이 연구되고 있다. ( ㉡ ) 부작용이 줄어드는 것은 물론이다. ( ㉢ ) 아직 비용이 높다는 점이 남은 과제다. ( ㉣ )", "given": "덕분에 약의 양을 줄이면서도 같은 효과를 낼 수 있다.", "o": ["㉠", "㉡", "㉢", "㉣"], "a": 1, "ex": "특정 부위에서만 풀리는 기술의 장점이 이어짐", "exv": "Câu cho sẵn nói ưu điểm: thuốc chỉ tác dụng đúng chỗ → sau câu giới thiệu công nghệ → ㉡."},

/* ---------- reading state ---------- */
let RDAY=1, RS={res:{}};
const RKEY=()=>"tpk-read"+RDAY;
function rload(){ RS={res:{}}; try{const s=JSON.parse(localStorage.getItem(RKEY())||"null"); if(s) RS=Object.assign(RS,s);}catch(e){} }
function rsave(){ try{localStorage.setItem(RKEY(),JSON.stringify(RS))}catch(e){} }
const RQ=()=>READ[RDAY].q;
const ul=s=>esc(s).replace(/⟦(.+?)⟧/g,'<u class="ul">$1</u>');
// question groups shown on the reading home
const RSETS30=[{r:[0,4],label:"1~5",ko:"유사 표현",vn:"Cách nói tương tự"},{r:[5,9],label:"6~10",ko:"안내문·그래프·기사",vn:"Thông báo · biểu đồ · tin ngắn"},{r:[10,15],label:"11~16",ko:"순서 배열",vn:"Sắp xếp thứ tự"},{r:[16,21],label:"17~22",ko:"빈칸 채우기",vn:"Điền vào chỗ trống"},{r:[22,27],label:"23~28",ko:"긴 글 읽기",vn:"Đọc đoạn văn dài"},{r:[28,29],label:"29~30",ko:"신문 기사 제목",vn:"Tiêu đề báo"}];
const RSETS20=[{r:[0,3],label:"1~4",ko:"유사 표현",vn:"Cách nói tương tự"},{r:[4,7],label:"5~8",ko:"안내문·그래프·기사",vn:"Thông báo · biểu đồ · tin ngắn"},{r:[8,11],label:"9~12",ko:"순서 배열",vn:"Sắp xếp thứ tự"},{r:[12,15],label:"13~16",ko:"빈칸 채우기",vn:"Điền vào chỗ trống"},{r:[16,19],label:"17~20",ko:"긴 글 읽기",vn:"Đọc đoạn văn dài"}];
const rsets=()=>READ[RDAY].sets||(RQ().length===30?RSETS30:RSETS20);

/* ---------- reading views ---------- */
function rHome(){ sec("read");
  stopAll(); setTitle("TOPIK II 읽기",menu); $("speed").hidden=true;
  const qs=RQ(), done=qs.filter((_,i)=>RS.res[i]!=null).length, ok=qs.filter((_,i)=>RS.res[i]===true).length;
  $("body").innerHTML=`
   ${dayTabs({days:READ,cur:RDAY,done:d=>dayDone("tpk-read",d,READ[d]?READ[d].q.length:1e9)})}
   <section class="hero"><div class="eyebrow">맞힌 문제 · CÂU ĐÚNG</div><div class="big">${ok}<small> / ${qs.length}</small></div>
     <div style="display:flex;gap:10px;align-items:center;margin-top:10px"><div class="bar"><i style="width:${done/qs.length*100}%"></i></div><span class="eyebrow">${done}문제 풂</span></div></section>
   <div class="sec"><b>유형별 · Theo dạng</b></div>
   ${rsets().map((s,i)=>{const ids=[];for(let k=s.r[0];k<=s.r[1];k++)ids.push(k);
     return `<button class="grp" data-s="${i}"><span class="n">${s.label}</span><span class="t"><b>${s.ko}</b><span class="vn">${s.vn}</span></span>
       <span class="dots">${ids.map(k=>`<i class="${RS.res[k]===true?"k":RS.res[k]===false?"w":""}"></i>`).join("")}</span></button>`}).join("")}`;
  $("body").querySelectorAll(".day[data-d]").forEach(b=>b.onclick=()=>{RDAY=+b.dataset.d;rload();rHome();});
  $("body").querySelectorAll(".grp").forEach(b=>b.onclick=()=>{const s=rsets()[+b.dataset.s];const ids=[];for(let k=s.r[0];k<=s.r[1];k++)ids.push(k);rStart(ids);});
  foot(`<button class="btn pri" id="go">${done&&done<qs.length?"이어서 풀기":"1번부터 풀기"}</button>`);
  $("go").onclick=()=>{ const left=[...Array(qs.length).keys()].filter(i=>RS.res[i]==null); rStart(left.length?left:[...Array(qs.length).keys()]); };
}
let R={ids:[],i:0,res:{}};
function rStart(ids){ R={ids,i:0,res:{}}; renderR(); }
function rBox(q){
  if(q.k==="s") return `<div class="sent">${ul(q.x)}</div>`;
  if(q.k==="h") return `<div class="headline">${esc(q.x)}</div>`;
  if(q.k==="ins") return `<div class="given"><span class="chip">주어진 문장 · Câu cho sẵn</span><p>${esc(q.given)}</p></div><div class="pass"><div class="pb"><p>${esc(q.x).replace(/\( ?(㉠|㉡|㉢|㉣) ?\)/g,'<span class="mk">$1</span>')}</p></div></div>`;
  if(q.k==="g") return `<div class="pass"><img src="${q.img||GRAPH1}" alt="${esc(q.x)}" style="display:block;width:100%;height:auto;background:#fff"></div>`;
  if(q.k==="n") return `<div class="pass notice"><div class="pb">${q.x.map((l,j)=>`<p class="${j===0?"nt":""}">${esc(l)}</p>`).join("")}</div></div>`;
  if(q.k==="o") return `<div class="pass"><div class="pb">${q.x.map(l=>`<p class="ol">${esc(l)}</p>`).join("")}</div></div>`;
  return `<div class="pass"><div class="pb"><p>${ul(q.x).replace(/\( \)/g,'<span class="mk">(　　)</span>')}</p></div></div>`;
}
function renderR(){ sec("read");
  const k=R.ids[R.i], q=RQ()[k], last=R.i===R.ids.length-1, I=RI[q.i];
  const ro=q.k==="ins"?[0,1,2,3]:shuffle([0,1,2,3]);
  setTitle(`${READ[RDAY].title} 읽기 · ${k+1}번`,rHome); $("speed").hidden=true;
  $("body").innerHTML=`<div class="prog"><span>${R.i+1} / ${R.ids.length}</span><div class="bar"><i style="width:${R.i/R.ids.length*100}%"></i></div></div>
   <div class="qhead"><span class="qno">${String(k+1).padStart(2,"0")}</span><span class="chip">${esc(q.t)}</span></div>
   <div class="instr">${q.who?I.q.replace("어머니",q.who):I.q}<span class="vn">${q.who==="나"?I.v.replace("'người mẹ'","nhân vật 'tôi'"):I.v}</span></div>
   ${rBox(q)}
   <div class="choices" id="chs">${ro.map((j,pos)=>`<button class="ch" data-i="${j}"><span class="k">${circ[pos]}</span><span>${esc(q.o[j])}</span></button>`).join("")}</div>
   <div id="fb"></div>`;
  const chs=[...$("chs").querySelectorAll(".ch")];
  const mark=pick=>{
    const ok=pick===q.a; RS.res[k]=ok; R.res[k]=ok; rsave();
    chs.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.a) b.classList.add("ok"); if(pick!=null&&j===pick&&!ok) b.classList.add("no"); });
    $("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"정답이에요":"정답은 "+circ[ro.indexOf(q.a)]}</b>${esc(renum(q.ex,ro))}<span class="vn">${esc(renum(q.exv,ro))}</span></div>`;
    foot(`<button class="btn pri" id="nx">${last?"결과 보기":"다음 문제"}</button>`);
    $("nx").onclick=()=>{ if(last) rResult(); else { R.i++; renderR(); $("body").scrollTop=0; } };
    try{$("fb").scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}
  };
  chs.forEach(b=>b.onclick=()=>mark(+b.dataset.i));
  foot(`<button class="btn sec" id="skip">잘 모르겠어요</button>`); $("skip").onclick=()=>mark(null);
}
function rResult(){ sec("read");
  setTitle("읽기 결과",rHome); $("speed").hidden=true;
  const ids=Object.keys(R.res).map(Number), ok=ids.filter(i=>R.res[i]).length, wrong=ids.filter(i=>!R.res[i]);
  const byT={}; ids.forEach(i=>{const s=rsets().find(s=>i>=s.r[0]&&i<=s.r[1]).ko; byT[s]=byT[s]||[0,0]; byT[s][1]++; if(R.res[i]) byT[s][0]++;});
  $("body").innerHTML=`<div class="done"><div class="eyebrow">${READ[RDAY].title} 읽기 · KẾT QUẢ</div><div class="big">${ok} / ${ids.length}</div>
    <div style="color:var(--muted);font-size:14px">${wrong.length?`틀린 문제: ${wrong.map(i=>i+1+"번").join(", ")}`:"모두 맞았어요!"}</div>
    ${Object.keys(byT).map(t=>`<div class="tb"><span class="chip" style="text-align:center">${t}</span><div class="bar"><i style="width:${byT[t][0]/byT[t][1]*100}%"></i></div><span>${byT[t][0]}/${byT[t][1]}</span></div>`).join("")}</div>`;
  foot(`<button class="btn sec" id="h">읽기 처음으로</button>${wrong.length?`<button class="btn pri" id="re">틀린 ${wrong.length}문제 다시</button>`:""}`);
  $("h").onclick=rHome; if($("re")) $("re").onclick=()=>rStart(wrong);
}

   <div class="seg"><button data-t="in" aria-pressed="${!up}">로그인<small>Đăng nhập</small></button><button data-t="up" aria-pressed="${up}">처음이에요<small>Đăng ký</small></button></div>
   <form id="af" class="aform" autocomplete="on">
    ${up?`<label>이름 · Họ tên<input id="aname" class="inp" autocomplete="name" placeholder="예: Nguyễn An" maxlength="40"></label>`:""}
    <label>아이디 · Tên đăng nhập<input id="aid" class="inp" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="영어 소문자·숫자 (예: an2005)" maxlength="20"></label>

  $("body").querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ LOGIN_TAB=b.dataset.t; showLogin(); });
  const go=async()=>{

window.onCloudUser=async u=>{

const isTeacher=()=>!!(window.CLOUD&&CLOUD.user&&CLOUD.user.id===TEACHER_ID);

/* teacher: every student's progress */
function sumRes(raw,key,total){ try{ const s=JSON.parse(raw||"null"); const r=(s&&s[key])||{}; const v=Object.values(r); return {n:v.length,ok:v.filter(Boolean).length,total}; }catch(e){ return {n:0,ok:0,total}; } }
function progCells(p){
  const L=Object.keys(DAYS).map(d=>["듣기",d,sumRes(p["tpk-day"+d],"res",DAYS[d].q.length)]);
  const R=Object.keys(READ).map(d=>["읽기",d,sumRes(p["tpk-read"+d],"res",READ[d].q.length)]);
  const W=Object.keys(WDAYS).map(d=>{ const raw=p[+d===1?"tpk-write":"tpk-write"+d], s=sumRes(raw,"n3",WDAYS[d].length);
    if(+d>=NOBRACKET_FROM){ try{ const o=JSON.parse(raw||"null")||{}; s.star=Object.keys(o.n3||{}).filter(i=>o.n3[i]&&!(o.h||{})[i]).length; }catch(e){} }
    return ["쓰기",d,s]; });
  return [L,R,W];
}
async function teacher(){
  sec(); stopAll(); setTitle("학생 기록",start); $("speed").hidden=true; foot(`<button class="btn sec" id="tr">새로고침 · Tải lại</button>`); $("tr").onclick=teacher;
  $("body").innerHTML=`<p class="tip">불러오는 중…</p>`;
  let list=[]; try{ list=await CLOUD.list(); }catch(e){ $("body").innerHTML=`<div class="fb no">학생 기록을 못 불러왔어요. Firestore 보안 규칙을 확인해 주세요. (${esc(e.code||e.message||e)})</div>`; return; }
  list=list.filter(u=>u.id!==TEACHER_ID).sort((a,b)=>String(a.name||a.id).localeCompare(String(b.name||b.id),"ko"));
  const when=t=>{ try{ const d=t&&t.toDate?t.toDate():null; return d?`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`:"-"; }catch(e){ return "-"; } };
  $("body").innerHTML=`<p class="tip" style="margin-top:0">버전 ${APP_VERSION} · 학생 ${list.length}명 · 칸 안의 숫자는 「푼 문제 / 전체」, 아래는 맞힌 개수예요.</p>`+(list.length?list.map(u=>{
    const p=u.p||{};
    return `<div class="tcard stu"><div class="sh"><div><b>${esc(u.name||"-")}</b><small>${esc(u.id||"")} · 마지막 ${when(u.updated)}</small></div>
      <button class="lockbtn ${u.unlockAll?"on":""}" data-uid="${esc(u.uid)}" data-v="${u.unlockAll?0:1}">${u.unlockAll?"🔓 전부 열림":"🔒 잠금 해제"}</button></div>
      ${progCells(p).map(row=>`<div class="prow"><span class="pl">${row[0][0]}</span>${row.map(([,d,s])=>`<span class="pc ${s.n>=s.total?"full":s.n?"part":""}"><i>Ngày ${d}</i>${s.n}/${s.total}<em>✓${s.ok}${s.star!=null?` ⭐${s.star}`:""}</em></span>`).join("")}</div>`).join("")}
    </div>`;}).join(""):`<div class="tcard">아직 가입한 학생이 없어요.</div>`);
  $("body").querySelectorAll(".lockbtn").forEach(b=>b.onclick=async()=>{
    const v=b.dataset.v==="1"; b.disabled=true;
    try{ await CLOUD.setUnlock(b.dataset.uid,v); teacher(); }catch(e){ b.disabled=false; alert("바꾸지 못했어요: "+(e.code||e.message)); }
  });
}

<script type="module">
/* ---------- Firebase: accounts + saving progress ---------- */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({
  apiKey:"AIzaSyDGeZpmvBdMvUCBL3CWXsx-tngWmfly7UQ",
  authDomain:"topikviet-b44f0.firebaseapp.com",
  projectId:"topikviet-b44f0",
  storageBucket:"topikviet-b44f0.firebasestorage.app",
  messagingSenderId:"869050098070",
  appId:"1:869050098070:web:a8c740e4fd8f53f8dbbdb7"
});
const auth=getAuth(app), db=getFirestore(app);
const DOMAIN="topikviet.app";            // student IDs become <id>@topikviet.app behind the scenes
const idOf=u=>String(u.email||"").split("@")[0];
let timer=null, signingUp=false;
const C=window.CLOUD={
  user:null, applying:false,
  async signup(id,name,pw){
    signingUp=true;
    try{
      const c=await createUserWithEmailAndPassword(auth,`${id}@${DOMAIN}`,pw);
      await setDoc(doc(db,"users",c.user.uid),{id,name,created:serverTimestamp(),updated:serverTimestamp(),p:lsSnapshot(),unlockAll:false});
      C.user={uid:c.user.uid,id,name};
    } finally { signingUp=false; }
    window.onCloudUser(C.user);
  },
  login(id,pw){ return signInWithEmailAndPassword(auth,`${id}@${DOMAIN}`,pw); },
  async logout(){ clearTimeout(timer); C.user=null; await signOut(auth); },
  async pull(){
    if(!C.user) return;
    const r=doc(db,"users",C.user.uid), s=await getDoc(r);
    if(!s.exists()){ await setDoc(r,{id:C.user.id,name:C.user.id,created:serverTimestamp(),updated:serverTimestamp(),p:lsSnapshot(),unlockAll:false}); C.user.name=C.user.id; UNLOCK_ALL=false; return; }
    const d=s.data(); C.user.name=d.name||C.user.id; UNLOCK_ALL=!!d.unlockAll;
    const p=d.p||{};
    C.applying=true;
    try{ lsClear(); Object.keys(p).forEach(k=>{ if(k.startsWith("tpk-")&&p[k]!=null) localStorage.setItem(k,p[k]); }); }
    finally{ C.applying=false; }
  },
  schedule(){ if(!C.user||C.applying) return; clearTimeout(timer); timer=setTimeout(()=>C.flush(),1200); },
  async flush(){ clearTimeout(timer); if(!C.user) return; await setDoc(doc(db,"users",C.user.uid),{p:lsSnapshot(),updated:serverTimestamp()},{merge:true}); },
  async list(){ const s=await getDocs(collection(db,"users")); return s.docs.map(d=>({uid:d.id,...d.data()})); },
  setUnlock(uid,v){ return setDoc(doc(db,"users",uid),{unlockAll:!!v},{merge:true}); }
};
addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&timer) C.flush().catch(()=>{}); });
addEventListener("pagehide",()=>{ if(timer) C.flush().catch(()=>{}); });
onAuthStateChanged(auth,u=>{
  if(signingUp) return;               // signup() finishes the setup itself
  C.user=u?{uid:u.uid,id:idOf(u),name:""}:null;
  window.onCloudUser(C.user);
});
</script>
