<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOPIK II 연습</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen phone app — header / scrolling middle / action footer. Dialogue script as chat-like speaker rows; female = warm, male = cool. */
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --ink:#16203A; --muted:#5E6782; --line:#D5DAE6;
  --accent:#2B4FA8; --accent-ink:#FFFFFF; --accent-soft:#DCE4F7;
  --good:#1D8449; --good-soft:#DAF0E1; --bad:#BF4836; --bad-soft:#F6E0DA;
  --mark:#F3C64E; --f:#B4436C; --f-soft:#F7E1EA; --m:#2C7A8C; --m-soft:#DDEFF2;
  --f-display:'Noto Sans KR','Be Vietnam Pro',system-ui,sans-serif;
  --f-vn:'Be Vietnam Pro','Noto Sans KR',system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1320; --surface:#181E2E; --ink:#E6EAF4; --muted:#97A0BA; --line:#2A3247;
  --accent:#7D9DF0; --accent-ink:#0B1430; --accent-soft:#1F2B4D;
  --good:#52C47F; --good-soft:#163222; --bad:#EC7B69; --bad-soft:#3A1F1A;
  --mark:#D9AE3F; --f:#EB8DB0; --f-soft:#3A2030; --m:#6CC3D4; --m-soft:#15323A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#181E2E; --ink:#E6EAF4; --muted:#97A0BA; --line:#2A3247;
  --accent:#7D9DF0; --accent-ink:#0B1430; --accent-soft:#1F2B4D;
  --good:#52C47F; --good-soft:#163222; --bad:#EC7B69; --bad-soft:#3A1F1A;
  --mark:#D9AE3F; --f:#EB8DB0; --f-soft:#3A2030; --m:#6CC3D4; --m-soft:#15323A; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-block:14px 10px;display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.back[hidden]{display:none}
.top h1{font-size:17px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speed{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mid{flex:1;min-height:0;overflow-y:auto;padding-block:4px 14px}
.foot{padding-block:10px 14px;display:flex;gap:10px}
.btn{flex:1;height:54px;border-radius:15px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.vn{font-family:var(--f-vn);color:var(--accent);font-size:13.5px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* home */
.hero{padding-block:8px 12px}
.hero .big{font-size:40px;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;color:var(--muted);font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;padding-block:2px 8px;scrollbar-width:none}
.day{flex:none;padding:8px 14px;border-radius:13px;background:var(--surface);border:1.5px solid var(--line);text-align:left}
.day b{display:block;font-family:var(--f-vn);font-size:15px}
.day span{font-size:11.5px;color:var(--muted)}
.day[aria-current="true"]{background:var(--ink);border-color:var(--ink)}
.day[aria-current="true"] b,.day[aria-current="true"] span{color:var(--bg)}
.day.soon{opacity:.5}
.howto{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.howto div{padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;line-height:1.4}
.howto b{display:block;color:var(--accent);font-size:13px}
.howto span{font-family:var(--f-vn);color:var(--muted);font-size:11.5px}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin:18px 2px 8px}
.sec b{font-size:14px;color:var(--ink)}
.btn.sec{margin:0;justify-content:center;align-items:center;font-size:16px;color:var(--ink)}
.grp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);margin-bottom:8px}
.grp .n{min-width:44px;height:30px;padding:0 6px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12.5px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.grp .t{flex:1;min-width:0}
.grp .t b{display:block;font-size:15px}
.grp .t span{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:90px}
.dots i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.dots i.k{background:var(--good)} .dots i.w{background:var(--bad)}
.all{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--accent-soft);border:1.5px solid var(--accent);text-align:left}
.all b{display:block;color:var(--accent)}
.all span{font-size:12.5px}
/* question */
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.steps{display:flex;gap:6px;margin-top:10px}
.steps button{flex:1;padding:8px 0;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px}
.steps button i{font-style:normal;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:var(--bg)}
.steps button[aria-current="step"]{color:var(--ink);border-color:var(--ink)}
.steps button.ok i{background:var(--good);color:var(--surface)}
.qhead{display:flex;align-items:center;gap:8px;margin-top:14px}
.qno{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.instr{font-size:14.5px;font-weight:600;margin-top:6px}
.instr .vn{display:block;font-weight:400}
.player{margin-top:12px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px}
.playbtn{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px -10px var(--accent)}
.playbtn.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.pmeta{font-size:13px;color:var(--muted);text-align:center}
.wave{display:flex;gap:4px;height:22px;align-items:center}
.wave i{width:4px;border-radius:2px;background:var(--line);height:6px;transition:height .2s}
.wave.on i{background:var(--accent);animation:wv .9s infinite ease-in-out}
.wave.on i:nth-child(2){animation-delay:.1s}.wave.on i:nth-child(3){animation-delay:.2s}.wave.on i:nth-child(4){animation-delay:.3s}.wave.on i:nth-child(5){animation-delay:.4s}
@keyframes wv{50%{height:20px}}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ch{padding:13px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:left;font-weight:600;display:flex;gap:12px;align-items:center}
.ch .k{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:13px;background:var(--bg);color:var(--muted)}
.ch.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ch.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:14px}
.fb b{display:block;font-size:13px;margin-bottom:2px}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}
.fb .vn{display:block;margin-top:4px}
/* script */
.script{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ln{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.ln .who{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.ln.F .who{background:var(--f-soft);color:var(--f)} .ln.M .who{background:var(--m-soft);color:var(--m)}
.ln .tx{flex:1;min-width:0;font-size:16px;line-height:1.55;padding-top:5px}
.ln.blank .tx{color:var(--muted)}
.ln.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ln.ev .tx{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--mark) 60%,transparent) 60%);}
.ln.pick{border-color:var(--bad)}
.ln.hit{border-color:var(--good);background:var(--good-soft)}
.ln .sp{flex:none;color:var(--muted);padding-top:7px}
.tip{margin-top:10px;font-size:13px;color:var(--muted)}
.words{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.words span{padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.words em{font-style:normal;font-family:var(--f-vn);color:var(--accent);margin-left:4px}
.readbox{margin-top:12px;display:flex;gap:8px}
.rc{flex:1;padding:12px;border-radius:14px;border:2px dashed var(--line);text-align:center;font-weight:700;color:var(--muted)}
.rc.done{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good)}
/* tips + result */
.tcard{margin-top:10px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tcard h3{margin:0 0 4px;font-size:16px}
.tcard ul{margin:6px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.done{text-align:center;padding-block:24px 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
.done .big{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tb{display:grid;grid-template-columns:88px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;width:100%;margin-top:8px;text-align:left}
.tb span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.note{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center}
/* menu + writing + vocab */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.mcard{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:16px 14px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);text-align:left;min-height:168px}
.mcard .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:10px}
.mcard b{font-size:20px;font-weight:800}
.mcard .mm{margin-top:auto;padding-top:10px;font-size:12px;color:var(--muted);line-height:1.45}
.mcard:disabled{opacity:.5;cursor:default}
.sent{margin-top:12px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:17px;line-height:1.9}
.blank{display:inline-block;min-width:80px;padding:0 8px;margin:0 3px;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;text-align:center;line-height:1.5}
.blank.fill{background:var(--good-soft);color:var(--good);border-color:var(--good);border-radius:6px 6px 0 0}
.blank.miss{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);border-radius:6px 6px 0 0}
.inp{width:100%;height:52px;margin-top:10px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.ok{border-color:var(--good)} .inp.no{border-color:var(--bad)}
.inp:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.irow{display:flex;gap:10px;align-items:center;margin-top:8px}
.irow b{flex:none;width:30px;font-size:20px;color:var(--accent);text-align:center}
.irow .inp{margin-top:0}
.pass{margin-top:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.pass .ph{padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.pass .pb{padding:14px;font-size:16px;line-height:1.8}
.pass .pb p{margin:0 0 4px}
.mk{font-weight:800;color:var(--accent);padding:1px 5px;background:var(--accent-soft);border-radius:6px;white-space:nowrap}
.mk.fill{color:var(--good);background:var(--good-soft);white-space:normal}
.model{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.model > span:last-child{display:flex;flex-direction:column}
.model small{color:var(--muted);font-size:12.5px}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 2px 10px;font-size:13px;color:var(--muted)}
.vlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.vrow{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow b{font-size:16px;flex:none}
.vrow .vn{flex:1;min-width:0;transition:filter .2s}
.vrow small{color:var(--muted);font-size:11px;white-space:nowrap}
.vlist.hide .vrow:not(.show) .vn{filter:blur(6px)}
@media (prefers-reduced-motion: reduce){.playbtn.on,.wave.on i{animation:none}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" id="back" hidden aria-label="처음으로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title">TOPIK II</h1>
    <button class="speed" id="speed" aria-label="말하기 속도">속도 1.0×</button>
  </header>
  <main class="mid" id="body"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
/* ---------- data ---------- */
// type: next(이어질 말) · act(이어서 할 행동) · same(내용과 같은 것) · main(중심 생각)
const TYPES={
  next:{ko:"이어질 말",vn:"Câu nói tiếp theo",q:"이어질 수 있는 말로 가장 알맞은 것을 고르십시오.",qvn:"Chọn câu nói tiếp theo phù hợp nhất.",
    tips:["마지막 사람의 말이 가장 중요해요. 질문이면 대답을, 소식이면 반응을 고르세요.","같은 단어가 나온 보기는 함정인 경우가 많아요.","시간(언제)·장소가 앞의 대화와 맞는지 확인하세요."],
    tvn:"Câu cuối là quan trọng nhất: nếu là câu hỏi → chọn câu trả lời; nếu là thông tin → chọn phản ứng."},
  act:{ko:"이어서 할 행동",vn:"Hành động tiếp theo",q:"여자가 이어서 할 행동으로 가장 알맞은 것을 고르십시오.",qvn:"Chọn hành động tiếp theo của người phụ nữ.",
    tips:["「제가 ~ㄹ게요」「~ㄹ 테니까」「~ㄹ까요? → 네」가 정답 신호예요.","이미 끝난 일(다 씻었고, 예약은 완료했고)은 오답이에요.","남자가 할 일과 여자가 할 일을 나눠서 들으세요."],
    tvn:"Tìm '~ㄹ게요', '~ㄹ 테니까', '~ㄹ까요? → 네'. Việc đã làm xong là đáp án sai."},
  same:{ko:"내용과 같은 것",vn:"Nội dung giống",q:"내용과 같은 것을 고르십시오.",qvn:"Chọn câu có nội dung giống với đoạn hội thoại.",
    tips:["듣기 전에 보기 4개를 먼저 읽으세요.","「누가」 했는지(남자/여자)를 꼭 확인하세요.","「~ㄴ 적이 있다」「~는 중이다」처럼 시간 표현이 바뀐 보기를 조심하세요."],
    tvn:"Đọc 4 lựa chọn trước. Kiểm tra AI làm (nam/nữ) và thì của động từ."},
  main:{ko:"남자의 중심 생각",vn:"Suy nghĩ chính",q:"남자의 중심 생각으로 가장 알맞은 것을 고르십시오.",qvn:"Chọn suy nghĩ chính của người đàn ông.",
    tips:["남자의 마지막 말에 중심 생각이 있어요.","「~는 게 좋다」「~아/어야 한다」「~면 좋겠다」를 찾으세요.","여자의 생각은 정답이 아니에요."],
    tvn:"Suy nghĩ chính nằm ở câu cuối của người nam: '~는 게 좋다', '~아/어야 한다', '~면 좋겠다'."}
};
// lines: [speaker F|M, text]; "_" = blank line. a: answer index (0-3). ev: evidence line indexes.
const DAYS={
 2:{title:"Ngày 2",sub:"20문제",q:[
 {t:"next",l:[["M","어제 왜 학원에 안 나왔어?"],["F","할머니 생신이라 부모님하고 할머니 댁에 갔다 왔어."],["M","_"]],o:["그래? 안 나와서 걱정했어.","무슨 학원에 다니고 있어?","그래? 할머니 댁에 언제 가?","부모님과 함께 가기로 했거든."],a:0,ev:[1],

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- speech ---------- */
const canSpeak="speechSynthesis" in window;
let VF=null,VM=null,playing=false,playToken=0;
function pickVoices(){
  if(!canSpeak) return; const ko=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
  const male=ko.find(v=>/male|남|injoon|minjun|man/i.test(v.name)&&!/female/i.test(v.name));
  const fem=ko.find(v=>/female|여|yuna|sunhi|heami|woman/i.test(v.name));
  VF=fem||ko[0]||null; VM=male||ko.find(v=>v!==VF)||ko[0]||null;
}
if(canSpeak){pickVoices(); speechSynthesis.onvoiceschanged=pickVoices;}
function sayLine(sp,text){
  return new Promise(res=>{
    if(!canSpeak){res();return;}
    const u=new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,"")); u.lang="ko-KR"; u.rate=0.95*rate;
    const v=sp==="M"?VM:VF; if(v) u.voice=v;
    u.pitch = (VF&&VM&&VF!==VM)? 1 : (sp==="M"?0.7:1.25);
    u.onend=res; u.onerror=res; speechSynthesis.speak(u);
    setTimeout(res, 4000+text.length*350/rate);
  });
}
async function playLines(lines,{onLine,skipBlank=true,fill}={}){
  stopAll(); const tk=++playToken; playing=true; uiPlay(true);
  for(let i=0;i<lines.length;i++){
    if(tk!==playToken) return;
    let [sp,tx]=lines[i];
    if(tx==="_"){ if(skipBlank&&!fill) continue; tx=fill; }
    onLine&&onLine(i);
    await sayLine(sp,tx);
    if(tk!==playToken) return;
    await new Promise(r=>setTimeout(r,350));
  }
  if(tk===playToken){ playing=false; uiPlay(false); onLine&&onLine(-1); }
}
function stopAll(){ playToken++; playing=false; if(canSpeak) try{speechSynthesis.cancel()}catch(e){} uiPlay(false); }
function uiPlay(on){ const b=$("pbtn"),w=$("wave"); if(b){b.classList.toggle("on",on); b.innerHTML=on?ICON.stop:ICON.play;} if(w) w.classList.toggle("on",on); }
const ICON={
  play:'<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  stop:'<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  sp:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>'
};

/* ---------- question flow ---------- */
let run=[],ri=0,step=0,ord=null,answered=null,runRes={};
function startRun(ids){ run=ids; ri=0; runRes={}; openQ(); }
function openQ(){ step=0; answered=null; ord=null; renderQ(); }
function curQ(){ return Q()[run[ri]]; }
function renderQ(){
  stopAll();
  const qi=run[ri], q=curQ(), T=TYPES[q.t];
  setTitle(`${DAYS[DAY].title} · ${qi+1}번`,true); $("speed").hidden=false;
  const hasAns=answered!==null;
  $("body").innerHTML=`
   <div class="prog"><span>${ri+1} / ${run.length}</span><div class="bar"><i style="width:${(ri+step/2)/run.length*100}%"></i></div></div>
   <div class="steps" id="steps">${["듣고 풀기","근거 찾기"].map((s,i)=>`<button data-s="${i}" aria-current="${i===step?"step":"false"}" class="${(i===0&&hasAns)||(i===1&&ST.ev[qi])?"ok":""}" ${i>0&&!hasAns?"disabled":""}><i>${i+1}</i>${s}</button>`).join("")}</div>
   <div class="qhead"><span class="qno">${String(qi+1).padStart(2,"0")}</span><span class="chip">${T.ko}</span></div>
   <div class="instr">${T.q}<span class="vn">${T.qvn}</span></div>
   <div id="stage"></div>`;
  $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(b.disabled) return; step=+b.dataset.s; renderQ(); });
  [stepListen,stepEvidence][step](q,qi);
}
function stepListen(q,qi){
  if(!ord) ord=[0,1,2,3];
  const hasAns=answered!==null;
  $("stage").innerHTML=`
   <div class="player"><button class="playbtn" id="pbtn" aria-label="듣기">${ICON.play}</button><div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div>
     <div class="pmeta">${hasAns?"대본은 ② 근거 찾기에서 볼 수 있어요":"대본 없이 듣고 답을 고르세요 · Nghe rồi chọn"}</div></div>
   <div class="choices" id="chs">${ord.map((oi,pos)=>`<button class="ch" data-i="${oi}"><span class="k">${circ[pos]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>
   <div id="fb"></div>`;
  $("pbtn").onclick=()=>{ if(playing){stopAll();return;} playLines(q.l); };
  const chs=[...$("chs").querySelectorAll(".ch")];
  const mark=pick=>{
    chs.forEach(b=>{b.disabled=true; if(+b.dataset.i===q.a) b.classList.add("ok"); if(pick!==null&&+b.dataset.i===pick&&pick!==q.a) b.classList.add("no");});
    const ok=pick===q.a;
    $("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"정답이에요":"정답은 "+circ[ord.indexOf(q.a)]}</b>${esc(q.ex)}<span class="vn">${esc(q.exv)}</span></div>`;
    foot(`<button class="btn pri" id="nx">② 근거 찾기</button>`); $("nx").onclick=()=>{step=1;renderQ();};
    try{$("fb").scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}
  };
  if(hasAns){ mark(answered); return; }
  chs.forEach(b=>b.onclick=()=>{
    stopAll(); answered=+b.dataset.i; const ok=answered===q.a;
    ST.res[qi]=ok; runRes[qi]=ok; save(); mark(answered);
    $("steps").querySelector('[data-s="0"]').classList.add("ok");
    $("steps").querySelectorAll("button").forEach(x=>x.disabled=false);
  });
  foot(`<button class="btn sec" id="skip">잘 모르겠어요</button>`);
  $("skip").onclick=()=>{ answered=-1; ST.res[qi]=false; runRes[qi]=false; save(); mark(null); $("steps").querySelectorAll("button").forEach(x=>x.disabled=false); };
  setTimeout(()=>{ if(!hasAns&&step===0) playLines(q.l); },400);
}
function scriptHtml(q,opts={}){
  return `<div class="script" id="script">${q.l.map(([sp,tx],i)=>{
    const t= tx==="_" ? (opts.fill?`<b>${esc(q.o[q.a])}</b>`:"______") : esc(tx);
    return `<button class="ln ${sp} ${tx==="_"?"blank":""} ${opts.ev&&q.ev.includes(i)?"ev":""}" data-i="${i}"><span class="who">${sp==="F"?"여자":"남자"}</span><span class="tx">${t}</span>${opts.sp?`<span class="sp">${ICON.sp}</span>`:""}</button>`}).join("")}</div>`;
}
function stepEvidence(q,qi){
  const shown=!!ST.ev[qi];
  $("stage").innerHTML=`<div class="tip">${shown?"노란 줄이 정답의 근거예요.":"정답의 근거가 되는 문장을 눌러 보세요. · Chạm vào câu căn cứ."}</div>${scriptHtml(q,{ev:shown,fill:true})}<div id="efb"></div><div class="words">${q.w.map(w=>`<span>${esc(w[0])}<em>${esc(w[1])}</em></span>`).join("")}</div>`;
  const lns=[...$("script").querySelectorAll(".ln")];
  const reveal=(ok)=>{
    lns.forEach((b,i)=>{ if(q.ev.includes(i)) b.classList.add("ev","hit"); });
    $("efb").innerHTML=`<div class="fb ${ok?"ok":""}"><b>${ok?"근거를 찾았어요":"근거 문장"}</b>${esc(q.ex)}<span class="vn">${esc(q.exv)}</span></div>`;
    ST.ev[qi]=true; save(); $("steps").querySelector('[data-s="1"]').classList.add("ok");
    const last=ri===run.length-1;
    foot(`<button class="btn pri" id="nx">${last?"결과 보기":"다음 문제"}</button>`);
    $("nx").onclick=()=>{ stopAll(); if(last) result(); else { ri++; openQ(); $("body").scrollTop=0; } };
  };
  if(shown){ reveal(true); return; }
  lns.forEach((b,i)=>b.onclick=()=>{
    if(q.ev.includes(i)) reveal(true);
    else { b.classList.add("pick"); setTimeout(()=>b.classList.remove("pick"),600); $("efb").innerHTML=`<div class="fb no"><b>다시 찾아보세요</b>정답 「${esc(q.o[q.a])}」과 직접 연결되는 말을 찾으세요.</div>`; }
  });
  foot(`<button class="btn sec" id="sh">근거 보기</button>`); $("sh").onclick=()=>reveal(false);
}
function result(){
  setTitle("결과",true);
  const ids=Object.keys(runRes).map(Number), ok=ids.filter(i=>runRes[i]).length;
  const byT={}; ids.forEach(i=>{const t=Q()[i].t; byT[t]=byT[t]||[0,0]; byT[t][1]++; if(runRes[i]) byT[t][0]++;});
  const wrong=ids.filter(i=>!runRes[i]);
  $("body").innerHTML=`<div class="done"><div class="eyebrow">${DAYS[DAY].title} · KẾT QUẢ</div><div class="big">${ok} / ${ids.length}</div>
    <div style="color:var(--muted);font-size:14px">${wrong.length?`틀린 문제: ${wrong.map(i=>i+1+"번").join(", ")}`:"모두 맞았어요!"}</div>
    ${Object.keys(byT).map(t=>`<div class="tb"><span class="chip" style="text-align:center">${TYPES[t].ko}</span><div class="bar"><i style="width:${byT[t][0]/byT[t][1]*100}%"></i></div><span>${byT[t][0]}/${byT[t][1]}</span></div>`).join("")}
    ${wrong.length?`<div class="tcard" style="text-align:left;width:100%"><h3>${TYPES[Q()[wrong[0]].t].ko} 공략법</h3><ul>${TYPES[Q()[wrong[0]].t].tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}</div>`;
  foot(`<button class="btn sec" id="h">처음으로</button>${wrong.length?`<button class="btn pri" id="re">틀린 ${wrong.length}문제 다시</button>`:""}`);
  $("h").onclick=home; if($("re")) $("re").onclick=()=>startRun(wrong);
}

 {id:"51-1",h:"[문자 메시지] 민호 → 수진",l:["수진 씨, 저 민호예요.","다음 주 시험 때문에 한국어 문법책이 필요한데 혹시 저에게 ( ㉠ )?","제 책은 지난주에 도서관에 두고 왔는데 다시 가 보니까 없었어요. 책을 ( ㉡ ).","내일 수업이 끝나고 꼭 돌려드릴게요."],a:[["빌려줄 수 있어요","빌려줄 수 있을까요"],["잃어버린 것 같아요","잃어버렸어요"]],p:"-아/어 줄 수 있어요? (부탁), -(으)ㄴ 것 같다 (추측) · 해요체 유지",pv:"Nhờ vả + phỏng đoán. Giữ văn phong 해요."},

 {id:"51-5",h:"[단체 문자] 한국어반 친구들에게",l:["여러분, 제가 지난달에 학교 근처의 새 집으로 ( ㉠ ).","그래서 이번 토요일 저녁에 집들이를 하려고 합니다.","음식은 제가 모두 준비할 테니까 아무것도 ( ㉡ ).","오실 수 있는 분은 목요일까지 알려 주세요."],a:[["이사했습니다","이사를 했습니다"],["가져오지 않으셔도 됩니다","사 오지 않으셔도 됩니다"]],p:"-지 않아도 되다 · 「제가 준비할 테니까」가 근거",pv:"'-지 않아도 되다': không cần ... Căn cứ: '제가 준비할 테니까'."},

 {id:"51-7",h:"[Email] 제목: 단체 예약 문의",l:["안녕하세요. 이번 주 금요일 저녁 7시에 10명이 ( ㉠ ).","혹시 조용하게 이야기할 수 있는 방이 있습니까?","그리고 일행 중에 고기를 먹지 않는 사람이 있습니다.","고기가 ( ㉡ ) 있으면 메뉴를 알려 주십시오."],a:[["예약하고 싶습니다","방문하려고 합니다"],["들어가지 않은 음식이"]],p:"-고 싶다, -(으)려고 하다 · -지 않은 + N (관형형)",pv:"Muốn đặt chỗ; định ngữ phủ định '-지 않은 + N'."},
 {id:"51-8",h:"[문자 메시지] 민수 → 지수",l:["지수야, 미안한데 오늘 회의가 늦게 끝나서 약속 시간인 6시까지 ( ㉠ ).","7시에 만나도 될까?","만약 7시가 ( ㉡ ) 내일 만나자.","답장 기다릴게."],a:[["못 갈 것 같아","가기 어려울 것 같아"],["안 되면","어려우면","힘들면"]],p:"-(으)ㄹ 것 같다, -(으)면 (조건) · 반말 유지 (91회 51번 유형)",pv:"Phỏng đoán + điều kiện. Giữ văn phong 반말."},
 {id:"51-9",h:"[공지] 한국 요리 동아리 신입 회원 모집",l:["한국 요리 동아리에서 새 회원을 모집합니다.","요리를 한 번도 ( ㉠ ) 누구나 신청할 수 있습니다.","매주 수요일에 모여서 함께 한국 음식을 만듭니다.","신청하고 싶은 사람은 신청서를 ( ㉡ ) 학생회관 205호에 내십시오."],a:[["해 본 적이 없어도","만들어 본 적이 없어도"],["작성해서","쓴 후에"]],p:"-아/어 본 적이 없다 + -아/어도 (양보) · 「누구나」와 호응",pv:"'Dù chưa từng ... ' (-아/어 본 적이 없어도), khớp với '누구나'."},
 {id:"51-10",h:"[고객 게시판] 인주쇼핑 | 제목: 교환 문의",l:["지난주에 인터넷으로 운동화를 주문했습니다.","그런데 오늘 받은 운동화가 제가 주문한 것과 사이즈가 ( ㉠ ).","저는 240을 주문했는데 250이 왔습니다.","240 사이즈로 ( ㉡ ) 어떻게 해야 합니까?"],a:[["다릅니다"],["교환하고 싶은데","교환하려면"]],p:"N과/와 다르다, -(으)려면 (목적 조건) · 뒤 「어떻게 해야 합니까?」와 호응",pv:"'N과/와 다르다'; '-(으)려면': nếu muốn ... thì, khớp với câu hỏi sau."},
 {id:"52-1",l:["사람들은 보통 졸리거나 피곤할 때 하품을 한다. 그런데 다른 사람이 하품하는 것을 보면 자기도 모르게 하품을 ( ㉠ ). 이런 현상은 가족이나 친구처럼 가까운 사이일수록 더 많이 나타난다. 그래서 전문가들은 하품이 다른 사람의 감정을 ( ㉡ ) 관련이 있다고 말한다."],a:[["하게 된다","따라 하게 된다"],["느끼는 능력과","공감하는 능력과"]],p:"-게 되다 (「자기도 모르게」와 호응), -는 능력과 관련이 있다",pv:"'자기도 모르게' → '-게 되다'. '-는 능력과 관련이 있다'."},
 {id:"52-2",l:["짧은 낮잠은 건강에 도움이 된다. 20분 정도 낮잠을 자면 피로가 풀리고 집중력이 높아진다. 하지만 낮잠을 너무 오래 ( ㉠ ). 낮잠을 오래 자면 밤에 잠이 잘 오지 않을 수 있기 때문이다. 따라서 낮잠은 30분을 ( ㉡ ) 자는 것이 좋다."],a:[["자는 것은 좋지 않다"],["넘지 않게","넘지 않도록"]],p:"-는 것은 좋지 않다 · 뒤 「때문이다」로 이유 제시, -지 않도록",pv:"'하지만' → ý ngược lại: không tốt. '-지 않도록': để không vượt quá."},
 {id:"52-3",l:["선인장은 비가 거의 오지 않는 사막에서도 잘 산다. 그 이유는 선인장이 두꺼운 줄기 안에 물을 ( ㉠ ). 또한 선인장의 잎은 가시 모양으로 되어 있다. 잎이 넓으면 물이 빨리 날아가지만 가시 모양의 잎은 물이 쉽게 ( ㉡ )."],a:[["저장할 수 있기 때문이다","저장하기 때문이다"],["날아가지 않는다","빠져나가지 않는다"]],p:"그 이유는 ~기 때문이다 (호응 필수), 「넓으면 ~지만」 대조",pv:"'그 이유는' → bắt buộc '-기 때문이다'. '-지만' đối lập."},
 {id:"52-4",l:["음식의 색깔은 식욕에 영향을 준다. 빨간색이나 주황색은 식욕을 ( ㉠ ). 그래서 많은 식당들이 인테리어에 이런 색을 사용한다. 반면 파란색은 식욕을 떨어뜨린다. 따라서 음식을 적게 먹으려고 하는 사람은 파란색 그릇을 ( ㉡ )."],a:[["높여 준다","돋운다"],["사용하는 것이 좋다"]],p:"반면 (대조) → 파란색은 떨어뜨림 / 따라서 ~것이 좋다 (결론)",pv:"'반면' đối lập: xanh làm giảm → đỏ làm tăng. '따라서' → '-는 것이 좋다'."},
 {id:"52-5",l:["사람이 거짓말을 하면 코 주변의 온도가 올라간다고 한다. 거짓말을 할 때는 자기도 모르게 긴장을 ( ㉠ ). 긴장하면 피가 빨리 돌아서 얼굴, 특히 코의 온도가 올라가는 것이다. 이 연구 결과는 앞으로 거짓말을 ( ㉡ ) 활용될 수 있을 것이다."],a:[["하게 되기 때문이다"],["찾아내는 데","알아내는 데"]],p:"~할 때는 ~기 때문이다, -는 데 활용되다",pv:"Giải thích lý do: '-기 때문이다'. '-는 데 활용되다': được dùng vào việc ..."},
 {id:"52-6",l:["황제펭귄은 영하 40도의 추위 속에서 겨울을 보낸다. 이때 펭귄들은 서로 몸을 붙이고 모여 있다. 이렇게 하면 혼자 있을 때보다 체온을 ( ㉠ ). 그런데 무리의 가운데에 있는 펭귄만 계속 따뜻하게 지내는 것은 아니다. 펭귄들은 조금씩 움직이면서 바깥쪽 펭귄과 안쪽 펭귄이 서로 ( ㉡ )."],a:[["잘 유지할 수 있다","더 따뜻하게 유지할 수 있다"],["자리를 바꾼다"]],p:"-보다 비교, 「~만 ~는 것은 아니다」 부분 부정 (96회 52번 유형)",pv:"So sánh '-보다'; phủ định một phần '~만 ~는 것은 아니다'."},
 {id:"52-7",l:["요즘은 많은 학생들이 공책 대신 노트북으로 필기를 한다. 노트북을 사용하면 손으로 쓸 때보다 더 많은 내용을 빨리 ( ㉠ ). 하지만 연구에 따르면 손으로 쓴 내용이 기억에 더 오래 남는다. 손으로 쓸 때는 들은 내용을 모두 받아 적을 수 없기 때문에 중요한 내용만 ( ㉡ ) 정리하게 된다."],a:[["적을 수 있다","받아 적을 수 있다"],["골라서","생각하면서"]],p:"-(으)ㄹ 수 있다 · 모두 적을 수 없다 → 중요한 것만 고르다",pv:"'-(으)ㄹ 수 있다'. Không ghi hết được → chỉ chọn ý quan trọng."},
 {id:"52-8",l:["비행기의 창문은 모두 둥근 모양이다. 예전에는 비행기 창문이 네모 모양이었다. 그런데 네모난 창문은 모서리에 힘이 ( ㉠ ) 쉽게 깨졌다. 반면 둥근 창문은 힘이 한곳에 모이지 않고 골고루 퍼진다. 그래서 오늘날 비행기에는 ( ㉡ ) 둥근 창문을 사용한다."],a:[["모이기 때문에","집중되어서"],["잘 깨지지 않는"]],p:"-기 때문에 (원인) · 앞 내용 요약 + 관형형 (102회 52번 유형)",pv:"Nguyên nhân '-기 때문에'; tóm tắt ý trước bằng định ngữ."},
 {id:"52-9",l:["커피에 들어 있는 카페인은 잠을 깨게 해 준다. 그래서 공부하거나 일할 때 커피를 ( ㉠ ). 하지만 카페인의 효과는 마신 후 5시간 이상 계속된다. 따라서 밤에 잠을 잘 자고 싶다면 ( ㉡ ) 커피를 마시지 않는 것이 좋다."],a:[["마시는 사람이 많다","많이 마신다"],["잠자기 5시간 전부터는","오후 늦게는"]],p:"그래서 (결과) · 앞의 「5시간 이상」 정보를 활용한 추론",pv:"'그래서' → kết quả. Dùng thông tin '5시간 이상' để suy luận."},
 {id:"52-10",l:["카멜레온이 주변 환경에 맞게 몸의 색깔을 바꾼다는 것은 잘 알려져 있다. 그런데 카멜레온이 몸을 숨기기 위해서만 색깔을 ( ㉠ ). 카멜레온은 기분이나 온도에 따라서도 몸의 색깔이 달라진다. 예를 들어 화가 나면 밝은 색으로 변하고, 추우면 햇빛을 잘 ( ㉡ ) 어두운 색으로 변한다."],a:[["바꾸는 것은 아니다"],["흡수하기 위해서","흡수할 수 있도록"]],p:"「~만 ~는 것은 아니다」 부분 부정, -기 위해서 (목적)",pv:"'-만 ... 는 것은 아니다': không chỉ ... ; '-기 위해서': để ..."}
];
const WSETS=[
 {k:"n3",r:[0,9],label:"1~10",ko:"문장 연습 · 실용문",vn:"Câu ngắn · văn thực dụng"},
 {k:"n3",r:[10,19],label:"11~20",ko:"문장 연습 · 설명문",vn:"Câu ngắn · văn giải thích"},
 {k:"p",r:[0,9],label:"51번",ko:"51번 실용문 (문자·이메일·안내문)",vn:"Câu 51 · tin nhắn, email, thông báo"},
 {k:"p",r:[10,19],label:"52번",ko:"52번 설명문 (-다체)",vn:"Câu 52 · văn giải thích (thể -다)"}
];

/* ---------- writing state ---------- */
const WKEY="tpk-write"; let WS={n3:{},n3a:{},p:{},pa:{}};
function wload(){ try{const s=JSON.parse(localStorage.getItem(WKEY)||"null"); if(s) WS=Object.assign(WS,s);}catch(e){} }
function wsave(){ try{localStorage.setItem(WKEY,JSON.stringify(WS))}catch(e){} }
const norm=s=>String(s||"").replace(/[\s.,!?~·"'()]/g,"");
const IC={
 listen:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2z"/></svg>',
 write:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
 read:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>',
 vocab:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>'
};
function wordList(){ const out=[]; Object.keys(DAYS).forEach(d=>DAYS[d].q.forEach((q,i)=>q.w.forEach(w=>out.push({k:w[0],v:w[1],src:`${DAYS[d].title} 듣기 ${i+1}번`})))); return out; }

/* ---------- start menu ---------- */
function menu(){
  stopAll(); setTitle("TOPIK II",null); $("speed").hidden=true;
  const lq=Q(), lok=lq.filter((_,i)=>ST.res[i]===true).length, ldone=lq.filter((_,i)=>ST.res[i]!=null).length;
  const wdone=Object.keys(WS.n3).length+Object.keys(WS.p).length, wok=Object.values(WS.n3).filter(Boolean).length+Object.values(WS.p).filter(Boolean).length;
  const nw=wordList().length;
  $("body").innerHTML=`
   <section class="hero"><div class="eyebrow">무엇을 공부할까요? · HÔM NAY HỌC GÌ?</div></section>
   <div class="menu">
    <button class="mcard" data-m="listen"><span class="ic">${IC.listen}</span><b>듣기</b><span class="vn">Nghe</span><span class="mm">${DAYS[DAY].title} · ${lq.length}문제<br>${ldone?`맞힌 문제 ${lok} / ${lq.length}`:"아직 시작 전"}</span></button>
    <button class="mcard" data-m="write"><span class="ic">${IC.write}</span><b>쓰기</b><span class="vn">Viết</span><span class="mm">문장 연습 20 · 51~52번 20<br>${wdone?`맞힌 문제 ${wok} / ${wdone}`:"아직 시작 전"}</span></button>
    <button class="mcard" disabled><span class="ic">${IC.read}</span><b>읽기</b><span class="vn">Đọc</span><span class="mm">자료가 오면 추가<br>Sắp có</span></button>
    <button class="mcard" data-m="vocab"><span class="ic">${IC.vocab}</span><b>단어장</b><span class="vn">Từ vựng</span><span class="mm">단어 ${nw}개<br>누르면 발음을 들어요</span></button>
   </div>`;
  $("body").querySelectorAll(".mcard[data-m]").forEach(b=>b.onclick=()=>({listen:home,write:wHome,vocab:vocab})[b.dataset.m]());
  foot("");
}

/* ---------- writing views ---------- */
function wHome(){
  stopAll(); setTitle("TOPIK II 쓰기",menu); $("speed").hidden=true;
  $("body").innerHTML=`
   <div class="tcard" style="margin-top:4px"><h3>이렇게 공부하세요</h3><div class="vn">Cách học</div>
    <ul><li>먼저 <b>문장 연습</b>으로 문법 형태를 익히세요. 쓰면 바로 채점돼요.</li><li>그다음 <b>51~52번</b>에서 ㉠㉡을 직접 쓰고, 모범 답안과 비교해서 스스로 채점하세요.</li><li>51번은 글의 말투(-습니다 / 해요 / 반말), 52번은 「-다」로 써요.</li></ul>
    <div class="vn" style="margin-top:6px">Luyện câu ngắn trước (chấm tự động) → rồi làm câu 51~52 và tự chấm theo đáp án mẫu.</div></div>
   <div class="sec"><b>세트 · Bộ bài</b></div>
   ${WSETS.map((s,i)=>{const ids=[];for(let k=s.r[0];k<=s.r[1];k++)ids.push(k); const R=WS[s.k];
     return `<button class="grp" data-s="${i}"><span class="n">${s.label}</span><span class="t"><b>${s.ko}</b><span class="vn">${s.vn}</span></span>
       <span class="dots">${ids.map(k=>`<i class="${R[k]===true?"k":R[k]===false?"w":""}"></i>`).join("")}</span></button>`}).join("")}
   <button class="btn sec" id="wreset" style="height:40px;font-size:13px;color:var(--muted);margin-top:6px;width:100%">쓰기 기록 지우기 · Xóa kết quả</button>`;
  $("body").querySelectorAll(".grp").forEach(b=>b.onclick=()=>{const s=WSETS[+b.dataset.s];const ids=[];for(let k=s.r[0];k<=s.r[1];k++)ids.push(k);wStart(s.k,ids);});
  $("wreset").onclick=()=>{ if(confirm("쓰기 기록을 모두 지울까요?")){ WS={n3:{},n3a:{},p:{},pa:{}}; wsave(); wHome(); } };
  const left=[...Array(20).keys()].filter(i=>WS.n3[i]==null);
  foot(`<button class="btn pri" id="go">${left.length?(left.length<20?"문장 연습 이어서":"문장 연습부터 시작"):"51~52번 풀기"}</button>`);
  $("go").onclick=()=>{ if(left.length) wStart("n3",left); else { const pl=[...Array(20).keys()].filter(i=>WS.p[i]==null); wStart("p",pl.length?pl:[...Array(20).keys()]); } };
}
let W={k:"n3",ids:[],i:0,res:{}};
function wStart(k,ids){ W={k,ids,i:0,res:{}}; (k==="n3"?renderN3:renderP)(); }
function wNext(){ const last=W.i===W.ids.length-1; if(last) wResult(); else { W.i++; (W.k==="n3"?renderN3:renderP)(); $("body").scrollTop=0; } }
function wProg(){ return `<div class="prog"><span>${W.i+1} / ${W.ids.length}</span><div class="bar"><i style="width:${W.i/W.ids.length*100}%"></i></div></div>`; }

function renderN3(){
  const k=W.ids[W.i], q=N3[k], last=W.i===W.ids.length-1;
  setTitle(`쓰기 · 문장 ${k+1}번`,wHome); $("speed").hidden=true;
  const [pre,post]=q.s.split("___");
  $("body").innerHTML=`${wProg()}
   <div class="qhead"><span class="qno">${String(k+1).padStart(2,"0")}</span><span class="chip">${k<10?"실용문":"설명문"}</span></div>
   <div class="instr">괄호 안의 말을 알맞게 바꿔 쓰십시오.<span class="vn">Chia từ trong ngoặc cho phù hợp với câu.</span></div>
   <div class="sent">${esc(pre)}<span class="blank" id="bl">(${esc(q.b)})</span>${esc(post)}</div>
   <input class="inp" id="in" lang="ko" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="여기에 쓰세요 · Viết vào đây">
   <div id="fb"></div>`;
  const inp=$("in");
  const check=give=>{
    const v=give?"":inp.value.trim(); if(!give&&!v){inp.focus();return;}
    const ok=!give&&q.a.some(x=>norm(x)===norm(v));
    WS.n3[k]=ok; WS.n3a[k]=v; wsave(); W.res[k]=ok;
    inp.disabled=true; inp.classList.add(ok?"ok":"no");
    const bl=$("bl"); bl.textContent=ok?v:q.a[0]; bl.classList.add(ok?"fill":"miss");
    $("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"정답이에요":"정답: "+esc(q.a.join(" / "))}</b>${!ok&&v?`내 답: ${esc(v)}<br>`:""}${esc(q.p)}<span class="vn">${esc(q.pv)}</span></div>`;
    foot(`<button class="btn pri" id="nx">${last?"결과 보기":"다음 문제"}</button>`); $("nx").onclick=wNext;
  };
  inp.onkeydown=e=>{ if(e.key==="Enter"&&!e.isComposing){ e.preventDefault(); check(false);} };
  foot(`<button class="btn sec" id="skip">모르겠어요</button><button class="btn pri" id="ck">확인</button>`);
  $("ck").onclick=()=>check(false); $("skip").onclick=()=>check(true);
}

const MK=["㉠","㉡"];
function passHtml(q,fill){
  const body=q.l.map(line=>`<p>${esc(line).replace(/\( ?(㉠|㉡) ?\)/g,(m,c)=>{const j=MK.indexOf(c); return fill?`<span class="mk fill">${esc(q.a[j][0])}</span>`:`<span class="mk">( ${c} )</span>`;})}</p>`).join("");
  return `<div class="pass">${q.h?`<div class="ph">${esc(q.h)}</div>`:""}<div class="pb">${body}</div></div>`;
}
function renderP(){
  const k=W.ids[W.i], q=WP[k], last=W.i===W.ids.length-1, is51=k<10;
  setTitle(`쓰기 · ${q.id}`,wHome); $("speed").hidden=true;
  $("body").innerHTML=`${wProg()}
   <div class="qhead"><span class="qno">${q.id}</span><span class="chip">${is51?"51번 실용문":"52번 설명문"}</span></div>
   <div class="instr">㉠과 ㉡에 알맞은 말을 각각 쓰십시오.<span class="vn">${is51?"Viết vào ㉠ và ㉡. Giữ đúng văn phong của bài (-습니다 / 해요 / 반말).":"Viết vào ㉠ và ㉡ bằng thể '-다'."}</span></div>
   <div id="pass">${passHtml(q,false)}</div>
   ${MK.map((m,j)=>`<div class="irow"><b>${m}</b><input class="inp" id="in${j}" lang="ko" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${m}에 쓸 말"></div>`).join("")}
   <div id="fb"></div>`;
  const ins=[$("in0"),$("in1")];
  ins[0].onkeydown=e=>{ if(e.key==="Enter"&&!e.isComposing){e.preventDefault(); ins[1].focus();} };
  const reveal=()=>{
    const mine=ins.map(x=>x.value.trim()); WS.pa[k]=mine; wsave();
    ins.forEach(x=>x.disabled=true);
    $("pass").innerHTML=passHtml(q,true);
    $("fb").innerHTML=`<div class="fb"><b>모범 답안 · Đáp án mẫu</b>
      ${MK.map((m,j)=>`<div class="model"><span class="mk">${m}</span><span><b>${esc(q.a[j].join(" / "))}</b>${mine[j]?`<small>내 답: ${esc(mine[j])}</small>`:`<small>내 답: (안 씀)</small>`}</span></div>`).join("")}
      <div style="margin-top:8px">▸ ${esc(q.p)}</div><span class="vn">${esc(q.pv)}</span>
      <div class="tip" style="margin-top:8px">뜻과 문법이 맞으면 다른 답도 정답이에요. 두 칸 모두 맞았나요?<span class="vn" style="display:block">Ý và ngữ pháp đúng thì cũng được tính đúng. Cả hai ô đều đúng chứ?</span></div></div>`;
    const mark=ok=>{ WS.p[k]=ok; W.res[k]=ok; wsave(); wNext(); };
    foot(`<button class="btn sec" id="no">틀렸어요 · Sai</button><button class="btn pri" id="yes">맞았어요 · Đúng</button>`);
    $("no").onclick=()=>mark(false); $("yes").onclick=()=>mark(true);
    try{$("fb").scrollIntoView({block:"start",behavior:"smooth"})}catch(e){}
  };
  foot(`<button class="btn pri" id="rv">정답 보기 · Xem đáp án</button>`); $("rv").onclick=reveal;
}
function wResult(){
  setTitle("쓰기 결과",wHome); $("speed").hidden=true;
  const ids=Object.keys(W.res).map(Number), ok=ids.filter(i=>W.res[i]).length, wrong=ids.filter(i=>!W.res[i]);
  const name=i=>W.k==="n3"?`${i+1}번`:WP[i].id;
  $("body").innerHTML=`<div class="done"><div class="eyebrow">${W.k==="n3"?"문장 연습":"51~52번"} · KẾT QUẢ</div><div class="big">${ok} / ${ids.length}</div>
    <div style="color:var(--muted);font-size:14px">${wrong.length?`틀린 문제: ${wrong.map(name).join(", ")}`:"모두 맞았어요!"}</div></div>
    ${W.k==="n3"&&wrong.length?`<div class="tcard"><h3>틀린 문장 정답</h3><ul>${wrong.map(i=>`<li>${i+1}번 · ${esc(N3[i].b)} → <b>${esc(N3[i].a[0])}</b> <span class="vn">${esc(N3[i].p)}</span></li>`).join("")}</ul></div>`:""}`;
  foot(`<button class="btn sec" id="h">쓰기 처음으로</button>${wrong.length?`<button class="btn pri" id="re">틀린 ${wrong.length}문제 다시</button>`:""}`);
  $("h").onclick=wHome; if($("re")) $("re").onclick=()=>wStart(W.k,wrong);
}

/* ---------- vocab ---------- */
let vHide=false;
function vocab(){
  stopAll(); setTitle("단어장",menu); $("speed").hidden=true;
  const list=wordList();
  $("body").innerHTML=`<div class="vbar"><span>${list.length}개 · 단어를 누르면 발음이 들려요</span><button class="speed" id="vh">${vHide?"뜻 보이기 · Hiện nghĩa":"뜻 가리기 · Ẩn nghĩa"}</button></div>
   <div class="vlist ${vHide?"hide":""}" id="vl">${list.map((w,i)=>`<button class="vrow" data-i="${i}"><b>${esc(w.k)}</b><span class="vn">${esc(w.v)}</span><small>${esc(w.src)}</small></button>`).join("")}</div>`;
  $("vh").onclick=()=>{ vHide=!vHide; vocab(); };
  $("vl").querySelectorAll(".vrow").forEach(b=>b.onclick=()=>{ b.classList.add("show"); const w=list[+b.dataset.i]; stopAll(); sayLine("F",w.k.replace(/~/g,"")); });
  foot(`<button class="btn sec" id="h">처음으로</button>`); $("h").onclick=menu;
}

load(); wload(); menu();
</script>
